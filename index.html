<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Passeport francophone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Direction visuelle : un passeport. Couverture bleu nuit et or, pages en papier de sécurité,
   une encre de tampon par escale. Une colonne de lecture (~68 caractères). */
:root {
  /* Palette chaude : cuir de passeport brun, or cuivré, papier crème */
  --nuit: #4a2417; --nuit-2: #5e3020; --or: #c07a1c; --or-clair: #f0c27a;
  --papier: #f7efe2; --papier-2: #efe1cb; --carte: #fffaf2;
  --encre: #2b1a12; --encre-douce: #6b5243; --trait: #e2cfb3;
  --mix-titre: 72%;
  --ok: #2e7a3a; --ok-fond: #e3f1dc; --erreur: #b3261e; --erreur-fond: #fbe2dc; --surligne: #ffe28a;
  --mer: #dfe9ef; --mer-trait: #bfd0db;
  /* Carte ancienne : même parchemin dans les deux thèmes, par choix */
  --parch: #f1e7d2; --terre: #d8c4a0; --sepia: #8a6f4e; --sepia-fonce: #4a3a28; --x: #d42a22;
  --f-titre: "Fraunces", Georgia, "Times New Roman", serif;
  --f-texte: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --nuit: #2a140c; --nuit-2: #3a1d12; --or: #e3a04a; --or-clair: #f3cf92;
    --papier: #1c1410; --papier-2: #271c16; --carte: #2a1f18;
    --encre: #f4e9dc; --encre-douce: #c7b3a1; --trait: #4a382c; --mix-titre: 45%;
    --ok: #5fc792; --ok-fond: #15352a; --erreur: #f0837a; --erreur-fond: #3d1c1d; --surligne: #4a3f17;
    --mer: #142033; --mer-trait: #24344f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --nuit: #2a140c; --nuit-2: #3a1d12; --or: #e3a04a; --or-clair: #f3cf92;
  --papier: #1c1410; --papier-2: #271c16; --carte: #2a1f18;
  --encre: #f4e9dc; --encre-douce: #c7b3a1; --trait: #4a382c; --mix-titre: 45%;
  --ok: #5fc792; --ok-fond: #15352a; --erreur: #f0837a; --erreur-fond: #3d1c1d; --surligne: #4a3f17;
  --mer: #142033; --mer-trait: #24344f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papier);
  background-image:
    repeating-radial-gradient(circle at 20% 30%, transparent 0 14px, color-mix(in srgb, var(--trait) 35%, transparent) 14px 15px),
    repeating-radial-gradient(circle at 80% 70%, transparent 0 18px, color-mix(in srgb, var(--trait) 25%, transparent) 18px 19px);
  color: var(--encre); font-family: var(--f-texte); font-size: 1.05rem; line-height: 1.6; min-height: 100vh;
}
h1, h2, h3 { font-family: var(--f-titre); line-height: 1.15; text-wrap: balance; margin: 0; font-weight: 700; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }

/* Barre */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nuit); }
.barre { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--nuit); color: #f3efe4; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 2px solid var(--or); }
.barre-in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.marque { font-family: var(--f-titre); font-size: 1.05rem; color: var(--or-clair); background: none; border: 0; padding: 0; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.nav button, .icone-btn { background: transparent; color: #f3efe4; border: 1px solid color-mix(in srgb, var(--or-clair) 45%, transparent); border-radius: 999px; padding: 4px 14px; font-size: .92rem; }
.nav button[aria-current="true"] { background: var(--or-clair); color: #15233f; border-color: var(--or-clair); }
.icone-btn { padding: 4px 10px; }
.chrono { font-family: var(--f-code); font-size: 1.05rem; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 6px; background: var(--nuit-2); color: #f3efe4; }
.chrono.urgent { background: var(--or); color: #2a160c; box-shadow: 0 0 0 1px var(--or-clair) inset; }
.chrono small { font-family: var(--f-texte); font-size: .75rem; opacity: .8; margin-right: 6px; }

main { max-width: 1040px; margin: 0 auto; padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
.colonne { max-width: 720px; width: 100%; margin: 0 auto; display: grid; gap: 22px; }
main section, .lexique, .question { scroll-margin-top: 120px; }
@media print { .barre, footer, .btn, .nav { display: none !important; } body { background: #fff; } .page { break-inside: avoid; } }
.page { background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; padding: clamp(18px, 4vw, 30px); display: grid; gap: 16px; min-width: 0; }
.etiquette { font-family: var(--f-code); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--encre-douce); }
.doux { color: var(--encre-douce); }
.petit { font-size: .9rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--nuit); background: var(--nuit); color: #f6f2e6; padding: 10px 20px; border-radius: 8px; font-weight: 700; letter-spacing: .02em; }
.btn:hover:not(:disabled) { background: var(--nuit-2); }
.btn.second { background: transparent; color: var(--encre); border-color: var(--trait); }
.btn.second:hover:not(:disabled) { border-color: var(--encre-douce); background: var(--papier-2); }
.btn.or { background: var(--or); border-color: var(--or); color: #1a1408; }
.btn.or:hover:not(:disabled) { background: var(--or-clair); border-color: var(--or-clair); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.rangee { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Couverture */
.couverture { background: radial-gradient(120% 90% at 50% 0%, var(--nuit-2), var(--nuit)); color: #f3efe4; border-radius: 14px 28px 28px 14px; border-left: 14px solid color-mix(in srgb, var(--nuit) 70%, #000); padding: clamp(28px, 6vw, 56px) clamp(20px, 5vw, 48px); display: grid; justify-items: center; text-align: center; gap: 18px; box-shadow: 0 18px 40px -20px rgba(10,18,35,.55); max-width: 560px; width: 100%; margin: 0 auto; }
.couverture .pays { font-family: var(--f-code); letter-spacing: .32em; font-size: .8rem; color: var(--or-clair); }
.couverture h1 { font-size: clamp(2rem, 7vw, 3rem); color: var(--or-clair); letter-spacing: .03em; }
.couverture .sous { font-family: var(--f-titre); font-style: italic; color: #d9d3c1; }
.globe { width: 130px; height: 130px; }
.bienvenue { font-family: var(--f-code); letter-spacing: .12em; font-size: 1.15rem; color: var(--or); text-align: center; }

.message { border-left: 4px solid var(--or); padding: 4px 0 4px 18px; font-family: var(--f-titre); font-style: italic; font-size: 1.12rem; display: grid; gap: 10px; }
.regles { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; }
.regles li::marker { font-family: var(--f-code); color: var(--or); font-weight: 600; }
.champ { display: grid; gap: 6px; }
.champ label { font-weight: 700; font-size: .95rem; }
input[type="text"], input[type="password"], textarea, select { font: inherit; color: var(--encre); background: var(--papier); border: 1.5px solid var(--trait); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { min-height: 80px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--or); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--or) 30%, transparent); }
.voyageurs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.roles { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.roles li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 12px; background: var(--papier-2); border-radius: 8px; }
.roles strong { min-width: 7em; }
.role-tag { font-family: var(--f-code); font-size: .82rem; letter-spacing: .06em; text-transform: uppercase; color: var(--or); }

/* Compagnons (tirage du guide) */
.guides { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
/* Cartes de jeu : papier crème, liseré doré, médaillon et bordure à la couleur du guide */
.guide { --g: #555; position: relative; border: 2px solid color-mix(in srgb, var(--g) 55%, var(--or)); border-radius: 14px; padding: 16px 8px 12px; display: grid; justify-items: center; align-content: start; gap: 6px; text-align: center;
  background: linear-gradient(180deg, color-mix(in srgb, var(--g) 9%, var(--carte)), var(--carte) 55%);
  box-shadow: inset 0 0 0 4px var(--carte), inset 0 0 0 5px color-mix(in srgb, var(--or) 45%, transparent), 0 2px 6px rgba(74, 36, 23, .12);
  transition: transform .15s, box-shadow .15s, opacity .25s, filter .25s; }
.av { position: relative; overflow: hidden; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; }
.guide .av { width: 84px; height: 84px; border-radius: 50%; background: var(--g); color: #fff; display: grid; place-items: center; font-family: var(--f-titre); font-size: 2rem;
  border: 3px solid var(--g); box-shadow: 0 0 0 2px var(--carte), 0 0 0 4px var(--or); }
.guide strong { font-family: var(--f-titre); font-size: 1.02rem; line-height: 1.2; margin-top: 4px; }
.guide span { font-size: .8rem; color: var(--encre-douce); line-height: 1.3; }
.ico-guide { width: 22px; height: 22px; fill: none; stroke: color-mix(in srgb, var(--g) var(--mix-titre), var(--encre)); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
.guide.vise { transform: translateY(-4px) scale(1.04); box-shadow: inset 0 0 0 4px var(--carte), inset 0 0 0 5px var(--or), 0 0 0 3px var(--or-clair), 0 8px 18px rgba(192, 122, 28, .35); }
.guide.choisi { transform: translateY(-4px) scale(1.05); border-color: var(--or);
  box-shadow: inset 0 0 0 4px var(--carte), inset 0 0 0 5px var(--or), 0 0 0 4px color-mix(in srgb, var(--or-clair) 70%, transparent), 0 10px 26px rgba(192, 122, 28, .45); }
.guides.fini .guide:not(.choisi) { opacity: .5; filter: saturate(.5); transform: scale(.96); }
.tampon-choisi { position: absolute; top: 8px; right: 6px; transform: rotate(-9deg); padding: 3px 7px; border: 2px double var(--x); border-radius: 6px; color: var(--x) !important; font-family: var(--f-code); font-size: .68rem !important; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; background: color-mix(in srgb, var(--carte) 85%, transparent); animation: tamponner .5s cubic-bezier(.2,1.4,.4,1) both; }
.bulle { --g: #555; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: start; background: color-mix(in srgb, var(--g) 10%, var(--carte)); border: 1px solid color-mix(in srgb, var(--g) 40%, var(--trait)); border-radius: 10px; padding: 12px 14px; }
.bulle .av { width: 48px; height: 48px; border-radius: 50%; background: var(--g); color: #fff; display: grid; place-items: center; font-family: var(--f-titre); font-size: 1.2rem; box-shadow: 0 0 0 2px var(--carte), 0 0 0 3px var(--or); }
.bulle p { font-style: italic; }

/* Carte de vol */
/* Carte façon Genially : parchemin, terres sépia, avions, croix rouges sur les escales visitées */
.titre-carte { font-family: var(--f-titre); font-weight: 500; text-align: center; letter-spacing: .06em; text-transform: uppercase; font-size: clamp(1.1rem, 3vw, 1.5rem); color: var(--sepia-fonce); }
.carte-vol { width: 100%; height: auto; display: block; border-radius: 10px; border: 2px dashed color-mix(in srgb, var(--sepia) 70%, transparent); background: var(--parch); }
.carte-cadre { overflow-x: auto; border-radius: 10px; -webkit-overflow-scrolling: touch; }
.carte-zone { position: relative; }
@media (max-width: 640px) { .carte-zone { min-width: 640px; } }
.carte-vol .parchemin { fill: var(--parch); }
/* Carte ancienne : côtes gravées, océans nommés, voilier, rose des vents, cartouche, cadre gradué */
.carte-vol .cote { fill: none; stroke: #8a6f4e; stroke-opacity: .28; stroke-width: 7; stroke-linejoin: round; }
.carte-vol .terres { fill: url(#terre-grad); }
.carte-vol .oceans text { font-family: var(--f-titre); font-style: italic; font-size: 15px; letter-spacing: .32em; text-transform: uppercase; fill: #8a6f4e; fill-opacity: .75; stroke: none; text-anchor: middle; }
.carte-vol .voilier path { fill: #6b4a2a; opacity: .7; }
.carte-vol .rose-vents circle { stroke: #6b4a2a; stroke-width: 1; opacity: .7; }
.carte-vol .rose-vents .branche { fill: #6b4a2a; opacity: .8; } .carte-vol .rose-vents .branche.petite { fill: #b0884f; }
.carte-vol .rose-vents text { font-size: 13px; fill: #6b4a2a; stroke: none; font-weight: 700; }
.carte-vol .cartouche rect { fill: #f6ecd3; stroke: #6b4a2a; stroke-width: 1.2; } .carte-vol .cartouche .filet-int { fill: none; stroke-width: .6; stroke-dasharray: 3 2; }
.carte-vol .cartouche text { font-size: 14px; font-style: italic; fill: #4a3a28; stroke: none; letter-spacing: .06em; }
.carte-vol .cadre-carte { fill: none; stroke: #6b4a2a; stroke-width: 1.4; opacity: .55; }
.carte-vol .graduations { stroke: #6b4a2a; stroke-width: 1.2; opacity: .55; }
/* Routes : prévues en pointillés, effectuées en rouge plein, celle de l'escale choisie qui s'anime */
.carte-vol .route.prevue { stroke: #6b4a2a; stroke-width: 1.2; stroke-dasharray: 3 6; opacity: .45; }
.carte-vol .route.faite { stroke: var(--or); stroke-width: 1.8; stroke-dasharray: none; opacity: .75; }
.carte-vol .route.sel { stroke: var(--or); stroke-width: 2.2; opacity: .9; stroke-dasharray: 6 6; animation: route-fil 1.2s linear infinite; }
@keyframes route-fil { to { stroke-dashoffset: -24; } }
/* Les noms des escales gardent une taille lisible quand on zoome */
.carte-vol .pt text { font-size: calc(18px * max(var(--z, 1), .5)); stroke-width: calc(4px * max(var(--z, 1), .5)); }
.carte-vol .oceans, .carte-vol .cartouche { transition: opacity .3s; }
/* Boutons de zoom */
.carte-wrap .zoom-carte { position: absolute; top: 10px; right: 10px; z-index: 4; display: flex; gap: 4px; }
.zoom-carte button { min-width: 34px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid #6b4a2a; background: rgba(246, 236, 211, .92); color: #4a3a28; font-family: var(--f-titre); font-weight: 700; font-size: 1.05rem; box-shadow: 0 2px 6px -2px rgba(0,0,0,.35); }
.zoom-carte button:hover { background: #fff6df; }
.fiche-carte.attend { opacity: 0; pointer-events: none; animation: none; }
/* Carte en liège : punaises rouges (vertes une fois l'escale visitée) et photo du pays au clic */
.carte-liege-wrap { position: relative; }
.carte-liege { position: relative; border-radius: 12px; overflow: visible; box-shadow: 0 14px 30px -18px rgba(60, 30, 10, .6); }
.plan-liege { position: relative; aspect-ratio: 1920 / 1072; max-width: 100%; }
.fond-liege { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.punaise-liege { position: absolute; z-index: 2; width: 0; height: 0; padding: 0; border: 0; background: none; cursor: pointer; }
/* La punaise : l'aiguille touche exactement le point de l'escale ; elle se plante à l'ouverture, se soulève au survol */
.punaise-liege .tete { position: absolute; left: 0; top: 0; width: clamp(26px, 3.2vw, 40px); height: auto; aspect-ratio: 40 / 60; overflow: visible;
  transform: translate(-50%, -96%) rotate(-8deg); transform-origin: 50% 96%; filter: drop-shadow(0 2px 2px rgba(60, 25, 5, .35)); transition: transform .18s cubic-bezier(.2, 1.4, .4, 1), filter .18s; }
.punaise-liege .ombre-pin { fill: rgba(40, 18, 4, .35); }
main.entree .punaise-liege .tete { animation: planter .55s cubic-bezier(.3, 1.5, .5, 1) both; animation-delay: calc(.3s + var(--k, 0) * .12s); }
@keyframes planter { from { opacity: 0; transform: translate(-50%, -150%) rotate(-25deg) scale(1.2); } to { opacity: 1; transform: translate(-50%, -96%) rotate(-8deg); } }
.punaise-liege:not(.visite):not(.sel) .tete { animation: respirer-pin 2.8s ease-in-out infinite; animation-delay: calc(var(--k, 0) * .4s); }
main.entree .punaise-liege:not(.visite):not(.sel) .tete { animation: planter .55s cubic-bezier(.3, 1.5, .5, 1) both, respirer-pin 2.8s ease-in-out 1.2s infinite; animation-delay: calc(.3s + var(--k, 0) * .12s), calc(1.2s + var(--k, 0) * .4s); }
@keyframes respirer-pin { 50% { transform: translate(-50%, -100%) rotate(-6deg); filter: drop-shadow(0 6px 4px rgba(60, 25, 5, .3)); } }
.punaise-liege:hover .tete, .punaise-liege.survol .tete, .punaise-liege:focus-visible .tete { transform: translate(-50%, -104%) rotate(-3deg) scale(1.15); filter: drop-shadow(0 8px 6px rgba(60, 25, 5, .35)); animation: none; }
.punaise-liege.sel .tete { transform: translate(-50%, -104%) rotate(0) scale(1.3); filter: drop-shadow(0 0 6px #f3d79a) drop-shadow(0 8px 6px rgba(60, 25, 5, .4)); animation: none; }
.punaise-liege:focus-visible { outline: none; }
.nom-punaise { position: absolute; left: 0; top: clamp(14px, 2vw, 24px); transform: translateX(-50%); white-space: nowrap; font-family: var(--f-titre); font-weight: 700; font-size: clamp(.7rem, 1.3vw, .95rem);
  color: #3b2416; background: rgba(255, 250, 240, .85); padding: 1px 8px; border-radius: 999px; box-shadow: 0 1px 3px rgba(0,0,0,.2); pointer-events: none; }
.fiche-pays { --c: #333; position: absolute; z-index: 5; width: min(320px, 70%); background: #fffdf8; border-radius: 6px; padding: 10px 10px 12px; display: grid; gap: 10px;
  box-shadow: 0 18px 34px -12px rgba(30, 15, 5, .6); animation: poser-fiche .35s cubic-bezier(.2, 1.3, .4, 1) both; color: #2b1a12; }
.fiche-pays.a-droite { margin-left: 30px; } .fiche-pays.a-gauche { transform: translateX(-100%); margin-left: -30px; }
.fiche-pays.en-bas { margin-top: -30px; } .fiche-pays.en-haut { translate: 0 -100%; margin-top: 30px; }
@keyframes poser-fiche { from { opacity: 0; scale: .85; rotate: -4deg; } to { opacity: 1; scale: 1; rotate: -1.5deg; } }
.fp-photo { position: relative; aspect-ratio: 16 / 10; border-radius: 3px; overflow: hidden; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, #efe6d4); }
.fp-photo .embleme { width: 40%; height: auto; animation: none; }
.fp-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.fp-photo .bande-drapeau { position: absolute; inset: auto 0 0; height: 6px; }
.fp-texte { display: grid; gap: 4px; }
.fp-texte strong { font-family: var(--f-titre); font-size: 1.3rem; color: color-mix(in srgb, var(--c) 70%, #2b1a12); }
.fp-texte span { font-size: .8rem; color: #6b5243; }
.fp-texte p { font-family: var(--f-titre); font-style: italic; font-size: .92rem; line-height: 1.35; color: #4a3a28; }
.fiche-pays .fermer-fiche { top: 14px; right: 14px; z-index: 2; background: rgba(255, 250, 240, .9); }
@media (max-width: 640px) {
  .nom-punaise { display: none; }
  .fiche-pays, .fiche-pays.a-gauche, .fiche-pays.en-haut { position: relative; left: auto !important; top: auto !important; width: 100%; margin: 12px 0 0; transform: none; translate: none; }
  .carte-liege { display: grid; }
}
@media (max-width: 640px) { .carte-wrap .zoom-carte { top: 6px; right: 6px; } }
/* Carte interactive : escale sélectionnée ou survolée, punaise-drapeau, fiche de l'escale */
.carte-vol .pt.sel .halo, .carte-vol .pt.survol .halo { fill: color-mix(in srgb, var(--or) 35%, transparent); stroke: var(--or); stroke-width: 2.5; }
.carte-vol .pt.sel .picto { fill: var(--or); stroke: var(--nuit); stroke-width: .6; paint-order: stroke; }
.carte-vol .pt .picto, .carte-vol .pt .punaise { transform-box: fill-box; transform-origin: center; }
.carte-vol .pt.sel .punaise, .carte-vol .pt.survol .punaise { transform: scale(1.25); }
.carte-vol .pt .punaise { transition: transform .2s; }
.visa-vignette.survol { transform: translateY(-3px); box-shadow: 0 0 0 2px var(--or), 0 12px 22px -14px rgba(60, 20, 10, .5); }
.fiche-carte { --c: #333; position: absolute; z-index: 3; width: min(280px, 62%); padding: 16px 14px 12px; border-radius: 10px; overflow: hidden;
  background: var(--page); background-image: var(--guilloche); background-size: 300px 150px; border: 1px solid color-mix(in srgb, var(--c) 35%, var(--trait));
  box-shadow: 0 16px 30px -14px rgba(40, 15, 5, .55); display: grid; gap: 8px; animation: fiche .28s cubic-bezier(.2, 1.3, .4, 1) both; }
.fiche-carte.a-droite { margin-left: 26px; } .fiche-carte.a-gauche { transform: translateX(-100%); margin-left: -26px; }
.fiche-carte.en-bas { margin-top: -20px; } .fiche-carte.en-haut { translate: 0 -100%; margin-top: 20px; }
@keyframes fiche { from { opacity: 0; scale: .9; } to { opacity: 1; scale: 1; } }
.fiche-carte .bande-drapeau { height: 6px; }
.fermer-fiche { position: absolute; top: 8px; right: 6px; width: 28px; height: 28px; border: 0; background: transparent; color: var(--encre-douce); font-size: 1.3rem; line-height: 1; border-radius: 50%; }
.fermer-fiche:hover { background: var(--papier-2); }
.fc-tete { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: center; padding-right: 22px; }
.fc-tete strong { display: block; font-family: var(--f-titre); font-size: 1.2rem; color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); }
.fc-tete span { font-size: .8rem; color: var(--encre-douce); }
.fc-contact { font-size: .85rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.photo-contact.mini { width: 34px; height: 34px; box-shadow: 0 0 0 2px var(--carte), 0 0 0 3px color-mix(in srgb, var(--c, var(--or)) 55%, transparent); }
.vv-contact, .fp-contact { display: flex; align-items: center; gap: 7px; margin-top: 3px; }
.fc-ambiance { font-family: var(--f-titre); font-style: italic; font-size: .92rem; line-height: 1.35; color: var(--encre-douce); }
.fc-pied { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.fc-pied .vv-etat.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-fond); }
.fc-pied .btn { padding: 8px 14px; }
.carte-wrap { position: relative; display: grid; }
.carte-wrap > .carte-cadre { order: 1; } .carte-wrap > .fiche-carte { order: 2; }
/* Sur téléphone, la carte défile : la fiche se place sous la carte au lieu de flotter dessus */
@media (max-width: 640px) {
  .fiche-carte, .fiche-carte.a-gauche, .fiche-carte.en-haut { position: relative; left: auto !important; top: auto !important; width: 100%; margin: 12px 0 0; transform: none; translate: none; }
}
.carte-vol .grille { stroke: color-mix(in srgb, var(--sepia) 22%, transparent); stroke-width: .8; fill: none; }
.carte-vol .terres { fill: var(--terre); stroke: var(--sepia); stroke-width: 1; stroke-linejoin: round; }
.carte-vol .route { fill: none; stroke: var(--x); stroke-width: 1.4; stroke-dasharray: 4 5; opacity: .55; }
.carte-vol text { font-family: var(--f-titre); font-size: 18px; fill: var(--sepia-fonce); font-weight: 500; paint-order: stroke; stroke: var(--parch); stroke-width: 4px; stroke-linejoin: round; }
.carte-vol .pt { cursor: pointer; outline: none; }
.carte-vol .pt .picto { fill: var(--nuit); transition: transform .15s; }
.carte-vol .pt .halo { fill: transparent; transition: fill .15s; }
.carte-vol .pt:hover .halo, .carte-vol .pt:focus-visible .halo { fill: color-mix(in srgb, var(--or) 30%, transparent); }
.carte-vol .pt:focus-visible .halo { stroke: var(--or); stroke-width: 2.5; }
.carte-vol .pt.visite text { opacity: .8; }
.carte-vol .croix path { stroke: var(--x); stroke-width: 5; stroke-linecap: round; fill: none; opacity: .92; }
.carte-vol .paris circle { fill: var(--nuit); }
.avion { transition: none; }

/* Pages du passeport */
.pages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.feuillet { --c: #333; text-align: left; background: var(--carte); border: 1px solid var(--trait); position: relative; overflow: hidden; border-radius: 8px; padding: 22px 14px 14px; display: grid; gap: 8px; align-content: start; color: var(--encre); min-width: 0; transition: transform .15s, border-color .15s; }
.feuillet:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c) 60%, var(--trait)); border-top-color: var(--c); }
.feuillet .num { font-family: var(--f-code); font-size: .75rem; color: var(--encre-douce); letter-spacing: .1em; }
.feuillet h3 { font-size: 1.15rem; color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); }
.feuillet .reg { font-size: .85rem; color: var(--encre-douce); }
.emplacement { width: 88px; height: 88px; justify-self: center; display: grid; place-items: center; border: 2px dashed var(--trait); border-radius: 50%; font-family: var(--f-code); font-size: 1.6rem; color: var(--encre-douce); }
.code-ligne { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.case { width: 48px; height: 58px; display: grid; place-items: center; border: 2px solid var(--trait); border-radius: 8px; font-family: var(--f-code); font-size: 1.6rem; font-weight: 600; background: var(--carte); }
.case.pleine { border-color: var(--or); }
.mrz { font-family: var(--f-code); font-size: .8rem; letter-spacing: .12em; color: var(--encre-douce); background: var(--papier-2); padding: 10px 12px; border-radius: 6px; overflow-x: auto; white-space: pre; }

/* Tampon */
.tampon { --c: #333; width: 96px; height: 96px; justify-self: center; border-radius: 50%; border: 3px double var(--c); display: grid; place-content: center; text-align: center; transform: rotate(-9deg); font-family: var(--f-code); line-height: 1.05; background: color-mix(in srgb, var(--c) 7%, transparent); color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); }
.tampon { position: relative; }
.tampon .t-fond { position: absolute; inset: 9%; border-radius: 50%; overflow: hidden; z-index: 0; opacity: .62; }
.tampon .t-drapeau { width: 100%; height: 100%; display: block; transform: rotate(4deg) scale(1.05); }
.tampon > :not(.t-fond) { position: relative; z-index: 1; text-shadow: 0 0 2px var(--carte), 0 0 4px var(--carte), 0 0 7px var(--carte); }
.tampon .t-chiffre { color: color-mix(in srgb, var(--c) 55%, var(--encre)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tampon .t-fond { opacity: .5; } }
:root[data-theme="dark"] .tampon .t-fond { opacity: .5; }
.tampon .t-code { font-size: .7rem; letter-spacing: .16em; }
.tampon .t-chiffre { font-size: 2.2rem; font-weight: 600; }
.tampon .t-nom { font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; }
.tampon.grand { width: 150px; height: 150px; border-width: 5px; }
.tampon.grand .t-chiffre { font-size: 3.4rem; }
.tampon.grand .t-nom { font-size: .78rem; }
.tampon.anime { animation: tamponner .55s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes tamponner { 0% { transform: scale(1.9) rotate(-2deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(-9deg); opacity: 1; } }

/* Transit (repris du Genially : « arrivée à destination… 00:03 ») */
.transit { display: grid; justify-items: center; gap: 18px; text-align: center; padding-block: 20px; }
.transit .compte { font-family: var(--f-code); font-size: 2.6rem; font-weight: 600; color: var(--or); font-variant-numeric: tabular-nums; }
.transit .ambiance { font-family: var(--f-titre); font-style: italic; font-size: 1.2rem; max-width: 34em; }

/* Escale */
.entete-escale { --c: #333; border-radius: 10px; padding: clamp(18px, 4vw, 28px); background: color-mix(in srgb, var(--c) 12%, var(--carte)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--trait)); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 18px; align-items: center; }
.entete-escale > div { display: grid; gap: 8px; }
/* Portrait du contact de l'escale (médaillon rond) */
.photo-contact { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 3px var(--carte), 0 0 0 4px color-mix(in srgb, var(--c, var(--or)) 55%, transparent), 0 6px 14px -6px rgba(40, 14, 4, .45); }
.photo-contact.grande { width: 112px; height: 112px; justify-self: center; animation: pop-contact .6s cubic-bezier(.2, 1.5, .4, 1) both; }
@keyframes pop-contact { from { transform: scale(.4) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
.ligne-contact { display: flex; align-items: center; gap: 12px; margin: 0; }
.entete-escale { position: relative; overflow: hidden; padding-top: calc(clamp(18px, 4vw, 28px) + 8px); }
/* Bande aux couleurs du drapeau de l'escale */
.bande-drapeau { position: absolute; inset: 0 0 auto; height: 8px; display: flex; box-shadow: inset 0 -1px 0 rgba(0,0,0,.12); }
.bande-drapeau span { flex: 1; }
.drapeau-mini { display: inline-flex; width: 30px; height: 18px; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.18); vertical-align: middle; }
.drapeau-mini span { flex: 1; }
.drapeau-mini svg { width: 100%; height: 100%; display: block; }
.entete-escale h2 { font-size: clamp(1.7rem, 5vw, 2.3rem); color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); }
.embleme { width: 92px; height: 92px; color: var(--c); }
.accroche { font-family: var(--f-titre); font-style: italic; font-size: 1.1rem; }
.etapes { display: flex; gap: 6px; flex-wrap: wrap; }
.etapes span { font-family: var(--f-code); font-size: .75rem; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--trait); background: var(--carte); color: var(--encre-douce); }
.etapes span.ok { border-color: var(--ok); background: var(--ok-fond); color: var(--encre); }
.document { display: grid; gap: 10px; }
.para { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 8px; padding: 8px 10px; border-radius: 8px; transition: background .3s; }
.para .n { font-family: var(--f-code); font-weight: 600; color: color-mix(in srgb, var(--c, var(--or)) 75%, var(--encre)); }
.para.surligne { background: var(--surligne); }
.para.lu { background: color-mix(in srgb, var(--or) 12%, transparent); }
.question { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--trait); }
.question:first-of-type { border-top: 0; padding-top: 0; }
.question h3 { font-family: var(--f-texte); font-size: 1.05rem; }
.options { display: grid; gap: 8px; }
.option { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; align-items: center; gap: 8px; text-align: left; background: var(--papier); color: var(--encre); border: 1.5px solid var(--trait); border-radius: 8px; padding: 10px 12px; }
.option:hover:not(:disabled) { border-color: var(--encre-douce); }
.option .l { font-family: var(--f-code); font-weight: 600; }
.option.juste { background: var(--ok-fond); border-color: var(--ok); }
.option.faux { background: var(--erreur-fond); border-color: var(--erreur); }
.option:disabled { cursor: default; }
.option .marque-etat { font-family: var(--f-code); font-size: .8rem; font-weight: 600; }
.option.juste .marque-etat { color: var(--ok); }
.option.faux .marque-etat { color: var(--erreur); }
.retour { font-size: .95rem; padding: 8px 12px; border-radius: 6px; }
.retour.faux { background: var(--erreur-fond); border-left: 4px solid var(--erreur); }
.retour.juste { background: var(--ok-fond); border-left: 4px solid var(--ok); }

/* Lexique : associer */
.lexique { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 10px 14px; }
.lexique .col { display: grid; gap: 8px; align-content: start; }
.tuile { text-align: left; background: var(--papier); color: var(--encre); border: 1.5px solid var(--trait); border-radius: 8px; padding: 10px 12px; min-height: 48px; }
.tuile.mot { font-weight: 700; }
.tuile[aria-pressed="true"] { border-color: var(--or); background: color-mix(in srgb, var(--or) 16%, var(--carte)); }
.tuile.trouve { background: var(--ok-fond); border-color: var(--ok); cursor: default; }
.tuile.secoue { animation: secouer .35s; border-color: var(--erreur); background: var(--erreur-fond); }
@keyframes secouer { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.carnet-mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
details summary { cursor: pointer; font-weight: 700; }
details[open] summary { margin-bottom: 12px; }
.condition { display: flex; gap: 8px; align-items: center; font-size: .92rem; }
.condition .puce { width: 1.3em; height: 1.3em; border-radius: 50%; border: 2px solid var(--trait); display: inline-grid; place-items: center; font-size: .75rem; flex: none; }
.condition.ok .puce { background: var(--ok); border-color: var(--ok); color: #fff; }
.recompense { display: grid; justify-items: center; gap: 14px; text-align: center; }

/* Carnet */
.fiches { display: grid; gap: 16px; }
.fiche { --c: #333; border-left: 6px solid var(--c); }
.fiche h3 { color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); font-size: 1.25rem; }
.fiche-grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fiche-grille .large { grid-column: 1 / -1; }
.suggestions { display: flex; gap: 6px; flex-wrap: wrap; }
.suggestions button { font-size: .82rem; padding: 2px 10px; border-radius: 999px; border: 1px dashed var(--trait); background: transparent; color: var(--encre-douce); }

/* Coffre */
.coffre { display: grid; justify-items: center; gap: 18px; text-align: center; }
.cadran { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.cadran label { display: grid; gap: 4px; justify-items: center; font-family: var(--f-code); font-size: .75rem; letter-spacing: .1em; color: var(--encre-douce); }
.cadran input { width: 56px; height: 68px; text-align: center; font-family: var(--f-code); font-size: 2rem; font-weight: 600; padding: 0; }
.serrure { width: 74px; height: 74px; }
.msg-coffre { padding: 10px 14px; border-radius: 8px; max-width: 520px; background: var(--erreur-fond); border-left: 4px solid var(--erreur); text-align: left; }
.fin { font-family: var(--f-titre); font-style: italic; font-size: 1.12rem; text-align: left; border-left: 4px solid var(--or); padding-left: 18px; }

/* Mission */
.sujets { display: grid; gap: 8px; }
.sujet { text-align: left; background: var(--papier); color: var(--encre); border: 1.5px solid var(--trait); border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: 2em minmax(0, 1fr); gap: 8px; }
.sujet[aria-pressed="true"] { border-color: var(--or); background: color-mix(in srgb, var(--or) 14%, var(--carte)); }
.sujet .l { font-family: var(--f-code); font-weight: 600; color: var(--or); }
.choix-escale { display: flex; gap: 8px; flex-wrap: wrap; }
.choix-escale button { --c: #333; border: 1.5px solid var(--trait); border-radius: 999px; padding: 4px 14px; background: var(--papier); color: var(--encre); }
.choix-escale button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 15%, var(--carte)); font-weight: 700; }
.face-a-face { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.face-a-face > div { background: var(--papier-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; font-size: .95rem; }
.face-a-face h3 { font-family: var(--f-texte); font-size: .95rem; }
.minuteurs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.minuteur { background: var(--nuit); color: #f3efe4; border-radius: 10px; padding: 16px; display: grid; gap: 10px; justify-items: center; text-align: center; }
.minuteur .temps { font-family: var(--f-code); font-size: clamp(2.2rem, 8vw, 3rem); font-variant-numeric: tabular-nums; font-weight: 600; color: var(--or-clair); }
.minuteur .temps.fini { color: #ff9b90; }
.minuteur .btn.second { color: #f3efe4; border-color: #47577a; }
.minuteur .btn.second:hover:not(:disabled) { background: var(--nuit-2); }
.minuteur .phase { font-size: .9rem; color: #cfd6e4; min-height: 1.4em; }
.tableau { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--trait); vertical-align: top; }
th { font-family: var(--f-code); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--encre-douce); font-weight: 600; }
td.num { font-family: var(--f-code); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.actif td { background: color-mix(in srgb, var(--or) 16%, transparent); }
.outils { display: flex; flex-wrap: wrap; gap: 8px; }
.outils button { background: var(--papier-2); border: 1px solid var(--trait); border-radius: 999px; padding: 4px 12px; font-size: .95rem; color: var(--encre); }
.coches { display: grid; gap: 8px; }
.coches label { display: flex; gap: 10px; align-items: flex-start; }
.coches input { width: 1.2em; height: 1.2em; margin-top: .25em; accent-color: var(--or); flex: none; }
.avis { background: color-mix(in srgb, var(--or) 14%, var(--carte)); border: 1px solid color-mix(in srgb, var(--or) 45%, var(--trait)); border-radius: 8px; padding: 12px 14px; }

/* Préparation : fil d'étapes (briefing → équipage → guide) */
.fil { display: flex; gap: 6px; flex-wrap: wrap; margin: 0; }
.fil span { font-family: var(--f-code); font-size: .75rem; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--trait); background: var(--carte); color: var(--encre-douce); }
.fil span.ici { border-color: var(--or); color: var(--encre); font-weight: 600; }

/* Enregistrement de l'exposé */
.enreg-live { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 8px; background: var(--erreur-fond); border: 1px solid var(--erreur); }
.point-rec { width: 14px; height: 14px; border-radius: 50%; background: #d7263d; box-shadow: 0 0 0 0 rgba(215, 38, 61, .6); animation: rec 1.2s ease-out infinite; }
@keyframes rec { 0% { box-shadow: 0 0 0 0 rgba(215, 38, 61, .6); } 100% { box-shadow: 0 0 0 12px rgba(215, 38, 61, 0); } }
.temps-rec { font-family: var(--f-code); font-size: 1.4rem; font-variant-numeric: tabular-nums; margin-left: auto; }
.lecteur-expose { width: 100%; }
.depot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding-top: 12px; border-top: 1px dashed var(--trait); }
.secours-enreg { display: grid; gap: 8px; justify-items: start; padding: 14px 16px; border-radius: 10px; background: var(--page-2); border: 1px solid var(--trait); }
.secours-enreg ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; }
.secours-enreg ol li::marker { color: var(--or); font-weight: 700; }

/* Bilan */
.tampons-bilan { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--papier-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.stat strong { font-family: var(--f-code); font-size: 1.6rem; font-variant-numeric: tabular-nums; color: var(--or); }
.stat span { font-size: .9rem; color: var(--encre-douce); }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Enseignante */
.etat-pill { display: inline-block; font-family: var(--f-code); font-size: .78rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--trait); }
.etat-pill.ok { background: var(--ok-fond); border-color: var(--ok); }
.etat-pill.faux { background: var(--erreur-fond); border-color: var(--erreur); }
.confirmer { background: var(--erreur-fond); border-left: 4px solid var(--erreur); padding: 12px 14px; border-radius: 6px; display: grid; gap: 10px; }
.copie-secours { min-height: 160px; font-family: var(--f-code); font-size: .82rem; }

footer { max-width: 1040px; margin: 0 auto; padding-block: 0 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; color: var(--encre-douce); font-size: .88rem; }
.lien { background: none; border: 0; padding: 0; color: var(--encre-douce); text-decoration: underline; text-underline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 900px) {
  .pages { grid-template-columns: minmax(0, 1fr); }
  .feuillet { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .feuillet .emplacement, .feuillet .tampon { grid-row: 1 / span 4; grid-column: 2; width: 78px; height: 78px; }
  .feuillet .tampon .t-chiffre { font-size: 1.8rem; }
  .feuillet .tampon .t-nom { font-size: .5rem; letter-spacing: 0; }
  .guides { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .voyageurs, .carnet-mini, .fiche-grille, .minuteurs, .lexique, .face-a-face { grid-template-columns: minmax(0, 1fr); }
  .entete-escale { grid-template-columns: minmax(0, 1fr); }
  .embleme { display: none; }
  .case { width: 42px; height: 52px; }
  .cadran input { width: 46px; height: 58px; }
}
/* =====================================================================
   ANIMATIONS ET MÉDIAS (Higgsfield)
   ===================================================================== */
/* Entrée d'écran : les blocs montent l'un après l'autre */
@keyframes monter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
main.entree > *, main.entree > .colonne > * { animation: monter .5s cubic-bezier(.2,.8,.3,1) both; }
main.entree > :nth-child(2), main.entree > .colonne > :nth-child(2) { animation-delay: .07s; }
main.entree > :nth-child(3), main.entree > .colonne > :nth-child(3) { animation-delay: .14s; }
main.entree > :nth-child(4), main.entree > .colonne > :nth-child(4) { animation-delay: .21s; }
main.entree > :nth-child(n+5), main.entree > .colonne > :nth-child(n+5) { animation-delay: .28s; }

/* Boutons : réponse au doigt, reflet sur les boutons dorés */
.btn { transition: transform .12s, background .15s, border-color .15s, box-shadow .2s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.or { position: relative; overflow: hidden; }
.btn.or:not(:disabled)::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%); transform: translateX(-120%); animation: reflet 3.6s ease-in-out infinite 1s; pointer-events: none; }
@keyframes reflet { 0%, 70% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.couverture .btn.or { animation: respirer 2.4s ease-in-out infinite; }
@keyframes respirer { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--or) 25%, transparent); } }

/* Couverture : globe qui flotte, vidéo de fond si elle existe */
.couverture { position: relative; overflow: hidden; isolation: isolate; }
.couverture > :not(.fond-media):not(.couture):not(.dorure) { position: relative; z-index: 2; }
.couverture .globe { animation: flotter 5s ease-in-out infinite; }
@keyframes flotter { 50% { transform: translateY(-6px) rotate(3deg); } }
.fond-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s; z-index: 0; pointer-events: none; }
.couverture .fond-media.pret { opacity: .38; }
.couverture::after { content: ""; position: absolute; inset: 0; z-index: 0; background: radial-gradient(90% 70% at 50% 40%, transparent, color-mix(in srgb, var(--nuit) 80%, transparent)); pointer-events: none; }
/* En-tête d'escale : image ou vidéo fondue sur la droite, le texte reste lisible */
.entete-escale { isolation: isolate; }
.entete-escale > :not(.fond-media):not(.bande-drapeau) { position: relative; z-index: 1; }
.entete-escale > .bande-drapeau { z-index: 2; display: flex; gap: 0; }
.entete-escale .fond-media { -webkit-mask-image: linear-gradient(90deg, transparent 15%, #000 70%); mask-image: linear-gradient(90deg, transparent 15%, #000 70%); }
.entete-escale .fond-media.pret { opacity: .5; }
@media (max-width: 560px) { .entete-escale .fond-media.pret { opacity: .22; } }
.embleme { animation: flotter 6s ease-in-out infinite; }
/* Martinique : en-tête tropical (corail vers lagon) et hibiscus qui se balance dans la brise */
.entete-escale.tropical { background: linear-gradient(115deg, color-mix(in srgb, #e2344c 16%, var(--carte)) 0%, color-mix(in srgb, #ff9a7a 10%, var(--carte)) 55%, color-mix(in srgb, #14a39a 16%, var(--carte)) 100%); }
.entete-escale.tropical .embleme { width: 128px; height: 128px; transform-origin: 50% 75%; animation: balancer 5s ease-in-out infinite; filter: drop-shadow(0 8px 10px rgba(110, 10, 40, .28)); }
@keyframes balancer { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(4deg) translateY(-3px); } }
main.entree .embleme .hib-fleur { transform-origin: 50px 50px; animation: eclore 1.1s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes eclore { from { transform: scale(.4) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* Transit : le hublot de l'avion, avec nuages (ou la vidéo de la destination) */
.hublot { --c: var(--or); position: relative; width: min(220px, 60vw); aspect-ratio: 4 / 5; border-radius: 46% / 40%; overflow: hidden;
  border: 12px solid color-mix(in srgb, var(--papier-2) 70%, #cfc6b8); box-shadow: inset 0 0 0 3px rgba(0,0,0,.12), inset 0 10px 30px rgba(0,0,0,.35), 0 10px 30px -12px rgba(0,0,0,.5);
  animation: tanguer 3s ease-in-out infinite; }
@keyframes tanguer { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg) translateY(-3px); } }
.hublot-ciel { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, #7fb6e6, color-mix(in srgb, var(--c) 35%, #f6d9a8)); }
.hublot-ciel .embleme { width: 46%; height: auto; opacity: .9; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)); animation: none; }
.nuage { position: absolute; height: 26px; border-radius: 50px; background: #fff; filter: blur(3px); opacity: .9; animation: nuage 2.2s linear infinite; }
.nuage.n1 { width: 90px; top: 18%; animation-duration: 2s; }
.nuage.n2 { width: 130px; top: 55%; animation-duration: 1.5s; animation-delay: -.6s; }
.nuage.n3 { width: 70px; top: 80%; animation-duration: 2.6s; animation-delay: -1.2s; }
@keyframes nuage { from { left: 110%; } to { left: -70%; } }
.hublot-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s; }
.hublot-media.pret { opacity: 1; }
.hublot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.35), transparent 40%); pointer-events: none; }
.transit .compte { animation: battre 1s ease-in-out infinite; }
@keyframes battre { 50% { transform: scale(1.08); } }

/* Carte : les escales à visiter appellent doucement */
.carte-vol .pulse { fill: none; stroke: var(--or); stroke-width: 2; opacity: 0; animation: appel 2.8s ease-out infinite; pointer-events: none; }
@keyframes appel { 0% { r: 10px; opacity: .9; } 100% { r: 30px; opacity: 0; } }
.feuillet { transition: transform .2s, border-color .15s, box-shadow .2s; }
.feuillet:hover { box-shadow: 0 10px 22px -14px rgba(74, 36, 23, .5); }

/* Quiz, lexique, tampon : réactions immédiates */
.option.vient.juste { animation: pop .4s cubic-bezier(.2,1.6,.4,1); }
@keyframes pop { 40% { transform: scale(1.04); } }
.option.vient.faux { animation: secouer .35s; }
.question.vient .retour { animation: monter .3s ease-out both; }
.tuile.trouve.vient { animation: trouve .6s ease-out; }
@keyframes trouve { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 100% { box-shadow: 0 0 0 12px transparent; } }
.tampon.anime { position: relative; }
.tampon.anime::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid var(--c); opacity: 0; animation: encre .8s .25s ease-out both; }
@keyframes encre { 0% { transform: scale(.8); opacity: .7; } 100% { transform: scale(1.6); opacity: 0; } }
.chrono.urgent { animation: urgence 1s ease-in-out infinite; }
@keyframes urgence { 50% { box-shadow: 0 0 0 4px rgba(179, 38, 30, .35); } }
.guide.vise .av { animation: pop .2s; }

/* Coffre : la serrure tremble, puis s'ouvre ; vidéo d'ouverture si elle existe */
.coffre-scene { display: grid; justify-items: center; gap: 14px; width: 100%; }
.coffre-media { width: 100%; max-width: 520px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; opacity: 0; transition: opacity .6s; box-shadow: 0 12px 30px -16px rgba(0,0,0,.6); }
.coffre-media.pret { opacity: 1; }
.coffre-scene.ouvre .serrure { animation: deverrouiller 1s cubic-bezier(.3,1.4,.5,1) both; }
@keyframes deverrouiller { 0% { transform: rotate(0); } 15% { transform: rotate(-8deg); } 30% { transform: rotate(8deg); } 45% { transform: rotate(-5deg); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
.coffre-scene.ouvre + h2, .coffre-scene.ouvre ~ .fin { animation: monter .6s .5s both; }

/* Bilan : les tampons tombent un à un */
.tampons-bilan .tampon { animation: tamponner .5s cubic-bezier(.2,1.4,.4,1) both; }
.tampons-bilan .tampon:nth-child(2) { animation-delay: .15s; } .tampons-bilan .tampon:nth-child(3) { animation-delay: .3s; }
.tampons-bilan .tampon:nth-child(4) { animation-delay: .45s; } .tampons-bilan .tampon:nth-child(5) { animation-delay: .6s; }
.tampons-bilan .tampon:nth-child(6) { animation-delay: .75s; } .tampons-bilan .tampon:nth-child(7) { animation-delay: .9s; }
.stat strong { animation: monter .5s both; }

/* =====================================================================
   LE LIVRET : le jeu est un vrai passeport (couverture en cuir, pages de sécurité, pages qui tournent)
   ===================================================================== */
:root { --cuir: #4a2c1a; --cuir-2: #6a4128; --cuir-ombre: #2a160c; --page: #fffaf0; --page-2: #f6ecd9; --lisere: #c9a25a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --cuir: #3a2214; --cuir-2: #53331f; --cuir-ombre: #1e0f07; --page: #2a1f18; --page-2: #33261d; --lisere: #a8813c; } }
:root[data-theme="dark"] { --cuir: #3a2214; --cuir-2: #53331f; --cuir-ombre: #1e0f07; --page: #2a1f18; --page-2: #33261d; --lisere: #a8813c; }

/* La barre du haut prend le cuir de la couverture */
.barre { background: linear-gradient(180deg, var(--cuir-2), var(--cuir)); border-bottom-color: var(--lisere); box-shadow: 0 2px 10px -4px rgba(40, 8, 12, .5); }
body::before { background: var(--cuir-2); }
.marque { color: #e9c77e; }

/* La page ouverte du passeport */
main.livret { position: relative; width: calc(100% - 32px); max-width: 1000px; margin: 22px auto 44px; padding: 54px clamp(16px, 4vw, 44px) 56px calc(clamp(16px, 4vw, 44px) + 22px);
  background-color: var(--page); background-image: var(--guilloche), linear-gradient(90deg, rgba(0,0,0,.07), transparent 40px);
  background-size: 420px 210px, auto; border-radius: 6px 16px 16px 6px; border: 1px solid var(--trait);
  box-shadow: 2px 2px 0 -1px var(--page-2), 2px 2px 0 0 var(--trait), 5px 5px 0 -1px var(--page-2), 5px 5px 0 0 var(--trait), 8px 8px 0 -1px var(--page-2), 8px 8px 0 0 var(--trait), 0 26px 50px -26px rgba(60, 20, 10, .45);
  transform-origin: left center; }
/* Page d'un pays : fond aux couleurs du drapeau, et la tranche des pages rayée de ses couleurs */
main.livret.pays { background-image: var(--guilloche), linear-gradient(90deg, rgba(0,0,0,.07), transparent 40px), var(--fond-pays); background-size: 420px 210px, auto, auto; transition: background-color .4s; }
main.livret.pays .pied-page .folio { border-color: transparent; background: var(--page); box-shadow: 0 0 0 2px var(--c, var(--lisere)); }
main.livret.pays .page { background: color-mix(in srgb, var(--carte) 82%, transparent); }
/* Reliure : couture dorée et ombre du pli */
main.livret::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 22px; border-radius: 6px 0 0 6px;
  background: linear-gradient(90deg, var(--cuir-ombre), var(--cuir) 60%, var(--cuir-2)); box-shadow: inset -2px 0 3px rgba(0,0,0,.35); }
main.livret::after { content: ""; position: absolute; top: 14px; bottom: 14px; left: 10px; border-left: 2px dashed color-mix(in srgb, var(--lisere) 75%, transparent); pointer-events: none; }
main.livret .page, main.livret .entete-escale { box-shadow: 0 1px 0 rgba(255,255,255,.5) inset, 0 6px 14px -12px rgba(60, 20, 10, .4); }
main.livret .page { background: color-mix(in srgb, var(--carte) 88%, transparent); }
/* Titre courant et folio, comme dans un vrai passeport */
.tete-page, .pied-page { position: absolute; left: 22px; right: 0; display: flex; align-items: center; gap: 12px; padding: 0 clamp(16px, 4vw, 44px); font-family: var(--f-code); font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; color: var(--encre-douce); pointer-events: none; }
.tete-page { top: 18px; }
.tete-page::after, .pied-page::before { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, color-mix(in srgb, var(--c, var(--lisere)) 70%, transparent), transparent); }
.pied-page { bottom: 18px; justify-content: space-between; }
.pied-page::before { order: 1; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--lisere) 60%, transparent), transparent); }
.pied-page .folio { order: 2; font-size: .9rem; letter-spacing: .1em; color: var(--encre); border: 1px solid var(--lisere); border-radius: 999px; padding: 2px 12px; background: var(--page); }
.pied-page .serie { order: 0; } .pied-page .serie-2 { order: 3; }
.pied-page .pastille { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--lisere)); display: inline-block; margin-right: 8px; vertical-align: middle; }
/* Filigrane : le globe, très pâle, au centre de chaque page */
.filigrane { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 0; overflow: hidden; border-radius: inherit; }
.filigrane svg { width: min(60%, 420px); height: auto; color: var(--lisere); opacity: .09; }
main.livret > :not(.filigrane):not(.tete-page):not(.pied-page) { position: relative; z-index: 1; }
/* Écran d'accueil : le passeport est fermé, on ne voit que la couverture */
main.ferme { padding-top: 34px; }

/* La page qui tourne quand on change d'écran (en avant : depuis la droite ; en arrière : depuis la gauche) */
@keyframes tourner-avant { 0% { transform: perspective(2200px) rotateY(-28deg) translateX(10px); opacity: .25; filter: brightness(.9); } 100% { transform: none; opacity: 1; filter: none; } }
@keyframes tourner-arriere { 0% { transform: perspective(2200px) rotateY(22deg) translateX(-10px); opacity: .25; filter: brightness(.9); } 100% { transform: none; opacity: 1; filter: none; } }
main.livret.tourne-avant { animation: tourner-avant .65s cubic-bezier(.2, .75, .25, 1) both; }
main.livret.tourne-arriere { transform-origin: right center; animation: tourner-arriere .65s cubic-bezier(.2, .75, .25, 1) both; }

/* Couverture en cuir : grain, couture, dorure à chaud */
.couverture { background: radial-gradient(120% 90% at 30% 0%, var(--cuir-2), var(--cuir) 55%, var(--cuir-ombre)); border-left: 16px solid var(--cuir-ombre);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.06), inset 0 0 60px rgba(0,0,0,.35), 0 3px 0 -1px #e9dcc4, 0 3px 0 0 #cdb894, 0 6px 0 -1px #e9dcc4, 0 6px 0 0 #cdb894, 0 30px 50px -24px rgba(40, 8, 12, .7);
  transform-origin: left center; }
.couverture::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: .5; mix-blend-mode: overlay; background-image: var(--grain); }
.couverture .couture { position: absolute; inset: 12px; border: 2px dashed color-mix(in srgb, var(--lisere) 70%, transparent); border-radius: 8px 20px 20px 8px; z-index: 1; pointer-events: none; }
.couverture .dorure { position: absolute; inset: 22px; border: 1px solid color-mix(in srgb, var(--lisere) 60%, transparent); outline: 1px solid color-mix(in srgb, var(--lisere) 35%, transparent); outline-offset: 4px; border-radius: 4px 14px 14px 4px; z-index: 1; pointer-events: none; }
.couverture h1 { background: linear-gradient(100deg, #b8862f 0%, #f7dd9a 30%, #c8953a 50%, #fbe7b0 70%, #b8862f 100%); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 1px 0 rgba(0,0,0,.5)); animation: dorure 6s ease-in-out infinite; }
@keyframes dorure { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
.couverture .globe { color: #e9c77e !important; filter: drop-shadow(0 1px 0 rgba(0,0,0,.6)); }
.couverture .pays { color: #e9c77e; }
.puce-bio { width: 46px; height: 30px; color: #e9c77e; opacity: .9; }
/* Ouverture de la couverture au moment d'embarquer */
@keyframes ouvrir-couverture { 0% { transform: perspective(1800px) rotateY(0); } 100% { transform: perspective(1800px) rotateY(-112deg); opacity: .4; } }
.couverture.ouvre { animation: ouvrir-couverture .85s cubic-bezier(.55, .05, .6, .4) forwards; }
.couverture.ouvre + .page { animation: monter .6s .3s both; }

/* Album photo du pays (entre le vol et l'atterrissage) : des polaroïds scotchés sur la page */
.album h2 { display: flex; align-items: center; gap: 10px; color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); }
.polaroids { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(16px, 3vw, 28px); padding: 10px 4px 6px; }
.polaroid { --r: calc((var(--i) - 1.5) * 2.4deg); margin: 0; background: #fffdf8; padding: 10px 10px 0; border-radius: 3px; position: relative;
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 12px 22px -14px rgba(60, 20, 10, .55); transform: rotate(var(--r));
  animation: poser .55s cubic-bezier(.2, 1.3, .4, 1) backwards; animation-delay: calc(.25s + var(--i) * .32s); }
.polaroid:nth-child(even) { --r: calc((1.5 - var(--i)) * 2.1deg + 1deg); }
.polaroid::before { content: ""; position: absolute; top: -10px; left: 50%; width: 74px; height: 22px; transform: translateX(-50%) rotate(-3deg);
  background: color-mix(in srgb, var(--c) 22%, rgba(255, 244, 214, .85)); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.polaroid .cliche { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: color-mix(in srgb, var(--c) 10%, #efe6d4); display: grid; place-items: center; }
.polaroid .cliche .embleme { width: 42%; height: auto; opacity: .55; animation: none; }
.cliche-media { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .6s; }
.cliche-media.pret { opacity: 1; }
.polaroid figcaption { font-family: var(--f-titre); font-style: italic; font-size: clamp(.92rem, 2.4vw, 1.08rem); color: #3a2a1e; text-align: center; padding: 10px 6px 14px; line-height: 1.25; }
.polaroid:hover { transform: rotate(0) scale(1.03); z-index: 2; transition: transform .25s; }
@keyframes poser { from { opacity: 0; transform: translateY(-26px) rotate(calc(var(--r) - 8deg)) scale(1.08); } to { opacity: 1; transform: rotate(var(--r)); } }
@media (max-width: 420px) { .polaroids { gap: 14px; } .polaroid { padding: 7px 7px 0; } .polaroid figcaption { padding: 7px 4px 10px; } }

/* Page d'identité (écran de l'équipage) */
.identite { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px 20px; padding: 18px; border-radius: 10px; background: linear-gradient(135deg, color-mix(in srgb, #2a8a8a 9%, var(--page)), color-mix(in srgb, #c0506a 8%, var(--page))); border: 1px solid var(--trait); position: relative; overflow: hidden; }
.identite::before { content: ""; position: absolute; inset: 0; background-image: var(--guilloche); background-size: 300px 150px; opacity: .9; pointer-events: none; }
.identite > * { position: relative; }
.identite .photo { width: 120px; aspect-ratio: 4 / 5; border-radius: 6px; background: color-mix(in srgb, var(--encre) 8%, var(--page)); border: 1px solid var(--trait); display: grid; place-items: center; overflow: hidden; }
.identite .photo svg { width: 70%; color: color-mix(in srgb, var(--encre) 35%, transparent); }
.identite dl { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.identite dt { font-family: var(--f-code); font-size: .64rem; letter-spacing: .14em; text-transform: uppercase; color: var(--encre-douce); }
.identite dd { margin: 2px 0 0; font-family: var(--f-code); font-weight: 600; text-transform: uppercase; overflow-wrap: anywhere; }
.identite .large { grid-column: 1 / -1; }
.identite .mrz { grid-column: 1 / -1; margin: 0; background: color-mix(in srgb, var(--page) 70%, transparent); }
.identite .hologramme { position: absolute; right: 14px; top: 14px; width: 54px; height: 54px; border-radius: 50%; background: conic-gradient(from 0deg, #ffd6e0, #d6f5ff, #e6ffd6, #fff1c2, #ffd6e0); opacity: .55; mix-blend-mode: multiply; animation: holo 8s linear infinite; }
@keyframes holo { to { transform: rotate(360deg); } }
/* Vidéo d'introduction : écran de cinéma sur la couverture, sous-titres et bouton « Passer » */
.intro { position: relative; aspect-ratio: 16 / 9; width: 100%; max-width: 900px; margin: 0 auto; border-radius: 14px; overflow: hidden; background: #0c0705;
  box-shadow: 0 0 0 6px var(--cuir), 0 0 0 7px var(--lisere), 0 30px 50px -24px rgba(40, 8, 12, .7); }
.intro-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.intro::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.35), transparent 22%, transparent 62%, rgba(0,0,0,.7)); }
.intro-st { position: absolute; left: 50%; transform: translateX(-50%); width: max-content; max-width: 88%; bottom: 8%; z-index: 1; margin: 0; text-align: center; color: #fff6e2; font-family: var(--f-titre); font-style: italic;
  font-size: clamp(1rem, 2.6vw, 1.45rem); line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,.8); background: rgba(20, 8, 4, .62); padding: .35em .8em; border-radius: 8px; }
.intro-st.apparait { animation: st-apparait .45s ease-out both; }
@keyframes st-apparait { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }
.intro-barre { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.15); z-index: 1; }
.intro-barre span { display: block; height: 100%; width: 0; background: var(--or-clair); transition: width .25s linear; }
.intro .intro-passer { position: absolute; top: 12px; right: 12px; z-index: 2; color: #fff6e2; border-color: rgba(255, 246, 226, .6); background: rgba(20, 8, 4, .6); padding: 6px 14px; }
.intro .intro-passer:hover:not(:disabled) { background: rgba(20, 8, 4, .8); color: #fff; }
.revoir-intro { color: #e9c77e !important; font-size: .9rem; }
/* Affiche des consignes de vol : elle descend, se déroule entre deux baguettes, puis on la lit */
.affiche-zone { display: grid; justify-items: center; gap: 14px; padding-top: 22px; }
.affiche { position: relative; width: min(720px, 100%); display: grid; animation: affiche-tombe .8s cubic-bezier(.3, 1.4, .5, 1) both; transform-origin: 50% 0; }
@keyframes affiche-tombe { from { transform: translateY(-60px) rotate(-3deg); opacity: 0; } to { transform: none; opacity: 1; } }
.affiche-baguette { position: relative; z-index: 2; height: 22px; margin: 0 -14px; border-radius: 11px; background: linear-gradient(180deg, #8a5a2b, #5b3416 55%, #3e2210); box-shadow: 0 6px 12px -6px rgba(0,0,0,.6), inset 0 2px 0 rgba(255,255,255,.18); }
.affiche-baguette::before, .affiche-baguette::after { content: ""; position: absolute; top: 50%; width: 26px; height: 26px; border-radius: 50%; transform: translateY(-50%); background: radial-gradient(circle at 35% 35%, #f3d79a, #b8863b 60%, #7a5216); }
.affiche-baguette::before { left: -10px; } .affiche-baguette::after { right: -10px; }
.affiche-ruban { margin: -4px auto; z-index: 1; display: grid; gap: 4px; justify-items: center; padding: 18px 26px; width: 100%; border: 0; cursor: pointer;
  background: linear-gradient(180deg, #e9d6ae, #f6ead0 40%, #e2cb9a); color: #3b2414; font-family: var(--f-titre); box-shadow: inset 0 0 0 2px rgba(138, 90, 31, .35); }
.affiche-ruban span { font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.affiche-ruban small { font-family: var(--f-texte, inherit); font-size: .95rem; color: #8a5a1f; animation: respirer 2.4s ease-in-out infinite; }
.affiche-ruban:hover { filter: brightness(1.05); } .affiche-ruban:focus-visible { outline: 3px solid var(--or); outline-offset: 3px; }
.affiche-corps { display: grid; grid-template-rows: 1fr; margin: -4px 0; animation: affiche-deroule 1.2s cubic-bezier(.45, 0, .2, 1) both; }
@keyframes affiche-deroule { from { grid-template-rows: 0fr; } to { grid-template-rows: 1fr; } }
.affiche-feuille { overflow: hidden; min-height: 0; padding: clamp(22px, 4vw, 38px) clamp(18px, 5vw, 48px); display: grid; gap: 10px; text-align: center; color: #3b2414;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.55), transparent 60%), linear-gradient(180deg, #f6ead0, #efdcb4); box-shadow: inset 0 0 0 2px rgba(138, 90, 31, .3), inset 0 0 40px rgba(138, 90, 31, .18); }
.affiche-sur { margin: 0; font-size: .8rem; letter-spacing: .3em; text-transform: uppercase; color: #8a5a1f; font-weight: 700; }
.affiche-titre { margin: 0; font-family: var(--f-titre); font-size: clamp(2rem, 6vw, 3rem); line-height: 1; color: #7a3b1c; }
.affiche-sous { margin: 0 0 6px; font-style: italic; color: #8a5a1f; }
.affiche-liste { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 22px; text-align: left; }
.affiche-liste li { display: flex; gap: 12px; align-items: flex-start; animation: consigne-apparait .5s ease-out both; animation-delay: calc(1s + var(--i) * .15s); }
@keyframes consigne-apparait { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.affiche-num { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-titre); font-weight: 700; color: #fff6e2; background: radial-gradient(circle at 35% 35%, #c98a3a, #7a3b1c); box-shadow: 0 0 0 2px #f6ead0, 0 0 0 3px #b8863b; }
.affiche-liste strong { font-family: var(--f-titre); font-size: 1.1rem; color: #7a3b1c; }
.affiche-liste p { margin: 2px 0 0; line-height: 1.4; }
.affiche-pied { display: grid; gap: 10px; justify-items: center; margin-top: 10px; padding-top: 14px; border-top: 2px dashed rgba(138, 90, 31, .35); animation: consigne-apparait .5s ease-out 2s both; }
.affiche-pied p { margin: 0; font-weight: 700; }
.affiche-passer { color: var(--encre-douce) !important; font-size: .9rem; }
@media (max-width: 620px) { .affiche-liste { grid-template-columns: minmax(0, 1fr); } }
/* Annonce de la vidéo, avec compte à rebours */
.annonce-video { position: absolute; inset: 0; z-index: 2; display: grid; place-content: center; justify-items: center; gap: 10px; padding: 20px; text-align: center; color: #fff6e2;
  background: linear-gradient(160deg, rgba(122, 59, 28, .8), rgba(201, 138, 58, .62)); backdrop-filter: blur(2px); text-shadow: 0 1px 3px rgba(60, 20, 6, .55); animation: fondu .4s ease both; }
.annonce-video .etiquette { color: #f3d79a; }
.annonce-video strong { font-family: var(--f-titre); font-size: clamp(1.2rem, 3.4vw, 2rem); max-width: 26ch; line-height: 1.2; }
.annonce-son { font-size: .95rem; opacity: .9; }
.annonce-decompte { margin-top: 6px; width: 82px; height: 82px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-titre); font-size: 2.6rem; font-weight: 700; color: #3b2414;
  background: radial-gradient(circle at 35% 35%, #f3d79a, #c98a3a); box-shadow: 0 0 0 4px rgba(243, 215, 154, .35), 0 0 0 10px rgba(243, 215, 154, .12); }
.annonce-decompte.bat { animation: decompte-bat .5s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes decompte-bat { from { transform: scale(1.35); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .affiche, .affiche-corps, .affiche-liste li, .affiche-pied, .annonce-decompte.bat { animation: none !important; } }
/* L'hôtesse sur la page du briefing */
.portrait-capitaine { position: relative; margin: 0; border-radius: 14px; overflow: hidden; }
.portrait-capitaine img { display: block; width: 100%; height: auto; }
.portrait-capitaine .revoir-capitaine { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); font-size: clamp(.95rem, 2.2vw, 1.2rem); padding: 8px 22px; white-space: nowrap; }
.portrait-capitaine .revoir-capitaine:active:not(:disabled) { transform: translateX(-50%) scale(.97); }
.intro img.intro-video { object-fit: cover; }
.intro-video.fondu { animation: fondu-intro .7s ease-out both; }
@keyframes fondu-intro { from { opacity: 0; filter: brightness(1.4) sepia(.4); } to { opacity: 1; filter: none; } }
.intro-depart { position: absolute; inset: auto 0 0; z-index: 2; display: grid; justify-items: center; gap: 8px; padding: 40px 16px 22px; text-align: center;
  background: linear-gradient(180deg, transparent, rgba(20, 8, 4, .75)); color: #fff6e2; font-size: .95rem; }
.intro-jouer { font-size: clamp(1rem, 2.4vw, 1.25rem); padding: 12px 26px; animation: respirer 2.4s ease-in-out infinite; }

/* Page 5 (option A) : la double page des visas et la serrure du code */
.visas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(12px, 2vw, 18px); }
.visa-vignette { --c: #333; position: relative; overflow: hidden; text-align: left; display: grid; gap: 10px; padding: 18px 14px 12px; border-radius: 8px; color: var(--encre);
  border: 1px solid color-mix(in srgb, var(--c) 30%, var(--trait)); background-color: color-mix(in srgb, var(--c) 5%, var(--page));
  background-image: var(--guilloche); background-size: 300px 150px; transition: transform .15s, box-shadow .2s; }
.visa-vignette:hover { transform: translateY(-3px) rotate(-.4deg); box-shadow: 0 12px 22px -14px rgba(60, 20, 10, .5); }
.visa-vignette .bande-drapeau { height: 6px; }
.vv-tete { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-code); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--encre-douce); }
.vv-code { color: color-mix(in srgb, var(--c) 70%, var(--encre)); font-weight: 600; }
.vv-corps { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: start; }
.vv-drapeau { width: 54px; aspect-ratio: 3 / 2; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.15); display: block; }
.vv-drapeau svg { width: 100%; height: 100%; display: block; }
.visa-vignette:not(.valide) .vv-drapeau { filter: grayscale(.55) opacity(.75); }
.vv-infos { display: grid; gap: 1px; font-size: .8rem; color: var(--encre-douce); line-height: 1.3; }
.vv-infos strong { font-family: var(--f-titre); font-size: 1.15rem; color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); }
.vv-pied { display: flex; justify-content: space-between; align-items: center; min-height: 74px; }
.vv-etat { font-family: var(--f-code); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--trait); }
.visa-vignette.valide .vv-etat { border-color: var(--ok); color: var(--ok); background: var(--ok-fond); }
.vv-emplacement { width: 70px; height: 70px; border-radius: 50%; border: 2px dashed color-mix(in srgb, var(--c) 45%, var(--trait)); display: grid; place-items: center; font-family: var(--f-code); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase; color: var(--encre-douce); animation: attendre 2.6s ease-in-out infinite; }
@keyframes attendre { 50% { border-color: var(--c); transform: scale(1.04); } }
.vv-pied .tampon { width: 78px; height: 78px; margin: -6px -4px -6px 0; }
.vv-pied .tampon .t-chiffre { font-size: 1.8rem; }
/* La serrure du code : une plaque de laiton à 6 crans */
.serrure-code .plaque { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 2vw, 18px); padding: 16px clamp(10px, 3vw, 22px); border-radius: 12px;
  background: linear-gradient(160deg, #e8c77f, #c39443 45%, #a87a32); box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 6px rgba(0,0,0,.25), 0 8px 18px -10px rgba(60, 30, 5, .6); }
.crans { display: flex; gap: clamp(6px, 1.6vw, 12px); flex-wrap: wrap; justify-content: center; }
.cran { --c: #333; width: clamp(40px, 9vw, 56px); height: clamp(54px, 12vw, 72px); border-radius: 8px; display: grid; grid-template-rows: auto 1fr; justify-items: center; align-items: center; padding-top: 4px;
  background: #2a1a10; box-shadow: inset 0 3px 6px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.35); color: #f3e3c0; }
.cran small { font-family: var(--f-code); font-size: .58rem; letter-spacing: .12em; color: #b9a27a; }
.cran b { font-family: var(--f-code); font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 600; }
.cran.plein { background: linear-gradient(180deg, #fff6df, #f1dfb6); color: #2b1a12; box-shadow: inset 0 0 0 2px var(--c), 0 2px 0 rgba(0,0,0,.2); }
.cran.plein small { color: color-mix(in srgb, var(--c) 70%, #2b1a12); }
.cran.enclenche { animation: enclencher .5s cubic-bezier(.2, 1.6, .4, 1) both; animation-delay: calc(.5s + var(--d)); }
@keyframes enclencher { 0% { transform: translateY(-14px) scale(1.15); opacity: .3; } 70% { transform: translateY(2px); } 100% { transform: none; opacity: 1; } }
.trou { width: 30px; height: 42px; fill: #2a1a10; flex: none; filter: drop-shadow(0 1px 0 rgba(255,255,255,.4)); }
.serrure-code.complete .plaque { animation: briller 2.4s ease-in-out infinite; }
@keyframes briller { 50% { box-shadow: inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 6px rgba(0,0,0,.25), 0 0 0 4px rgba(240, 194, 122, .55), 0 0 30px rgba(240, 194, 122, .6); } }
@media (max-width: 760px) { .visas { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 440px) {
  .visas { grid-template-columns: minmax(0, 1fr); } .trou { display: none; }
  .serrure-code .plaque { padding: 12px 8px; }
  .crans { flex-wrap: nowrap; gap: 5px; }
  .cran { width: 36px; height: 52px; } .cran b { font-size: 1.3rem; } .cran small { font-size: .52rem; letter-spacing: .06em; }
}

/* Page 4 (option A) : « Chez nous », notre album à nous, à légender */
.album-cn .polaroid { animation: none; }
main.entree .album-cn .polaroid { animation: poser .55s cubic-bezier(.2, 1.3, .4, 1) backwards; animation-delay: calc(.25s + var(--i) * .32s); }
.album-cn .cliche { --cn-a: #b9b1a3; --cn-b: #9d9486; --cn-c: #cfc7b8; background: linear-gradient(160deg, #ded8cc, #cbc3b4); filter: grayscale(1) contrast(.9); transition: filter 1.4s ease, background 1.4s ease; }

.album-cn .polaroid.developpe .cliche { --cn-a: #e2344c; --cn-b: #d99a2b; --cn-c: #14a39a; background: linear-gradient(160deg, #fff1d6, #ffd9c2 55%, #d6f1ec); filter: none; }
