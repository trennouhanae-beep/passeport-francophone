    clearTimeout(enreg.arretAuto);
    enreg.flux.getTracks().forEach((t) => t.stop());
    if (enreg.url) URL.revokeObjectURL(enreg.url);
    enreg.url = URL.createObjectURL(new Blob(morceaux, { type: enreg.rec.mimeType || mime || "audio/webm" }));
    enreg.duree = (Date.now() - enreg.debut) / 1000; enreg.etat = "fini";
    const m = ui.minuteurs.pres; if (m.debut) { m.ecoule += (Date.now() - m.debut) / 1000; m.debut = null; }
    maj({ expose: { enregistre: true, duree: Math.round(enreg.duree), nb: (etat.expose?.nb || 0) + 1 } }, { rendu: false });
    son.juste(); majEnregistrement(); annoncer("Enregistrement terminé");
  };
  enreg.rec.start(1000);
  enreg.debut = Date.now(); enreg.etat = "enregistre";
  // Sécurité : arrêt automatique 30 s après la fin du temps de présentation
  enreg.arretAuto = setTimeout(() => { if (enreg.rec && enreg.rec.state === "recording") enreg.rec.stop(); }, (REGLAGES.PRESENTATION_MIN * 60 + 30) * 1000);
  const m = ui.minuteurs.pres; if (!m.debut) { m.ecoule = 0; m.debut = Date.now(); }

}
function resteMinuteur(m) { return m.duree - (m.ecoule + (m.debut ? (Date.now() - m.debut) / 1000 : 0)); }
function phasePresentation() {
  const m = ui.minuteurs.pres; const ecoule = m.duree - resteMinuteur(m);

  for (let k = 0; k < CANEVAS.length; k++) { cumul += CANEVAS[k][3]; if (ecoule < cumul) return k; }
  return -1;
}

      <button data-action="aller" data-ecran="carnet" aria-current="${actif("carnet")}">Carnet</button>

  majChrono();
}
function majChrono() {
  majSablier(); verifierAlertes();
  const el = document.getElementById("chrono"); if (!el) return;
  const r = resteJeu();
  el.classList.toggle("urgent", r < 300 && !etat.finJeu);
  el.innerHTML = etat.finJeu ? `<small>Voyage terminé</small>${mmss(REGLAGES.DUREE_JEU_MIN * 60 - r)}` : r > 0 ? `<small>Décollage dans</small>${mmss(r)}` : `L'avion décolle !`;

  el.style.setProperty("--reste", etat.finJeu ? 0 : Math.max(0, r) / (REGLAGES.DUREE_JEU_MIN * 60));
}
function afficher() {
  const ecrans = { accueil: ecranAccueil, capitaine: ecranCapitaine, equipage: ecranEquipage, guide: ecranGuide, cheznous: ecranChezNous, carte: ecranCarte, escale: ecranEscale, carnet: ecranCarnet, coffre: ecranCoffre, mission: ecranMission, bilan: ecranBilan, enseignante: ecranEnseignante };
  const fn = ui.transit ? ecranTransit : ecrans[etat.ecran] || ecranAccueil;
  const app = document.getElementById("app");
  // On garde les vidéos et images déjà chargées d'un affichage à l'autre (sinon elles repartiraient de zéro à chaque clic)
  const garde = new Map([...app.querySelectorAll("[data-media]")].map((n) => [n.dataset.media, n]));
  // Accueil : le passeport est fermé (couverture seule) ; ailleurs, on est sur une page ouverte du livret
  const ouvert = ui.transit || etat.ecran !== "accueil";
  app.classList.toggle("livret", Boolean(ouvert)); app.classList.toggle("ferme", !ouvert);
  // Pages d'un pays (vol, album, escale) : le fond de la page prend les couleurs de son drapeau
  const idPays = ui.transit ? (ui.transit.vers !== "cheznous" ? ui.transit.vers : null) : etat.ecran === "escale" ? etat.escaleActive : null;
  const pays = idPays && escaleParId(idPays);
  app.classList.toggle("pays", Boolean(pays));
  if (pays) {
    const cs = (pays.drapeau || [pays.couleur]).map((c) => (c.toLowerCase() === "#ffffff" ? pays.teinte || pays.couleur : c));
    const [c1, c2 = c1, c3 = c1] = cs;
    app.style.setProperty("--fond-pays", `linear-gradient(125deg, color-mix(in srgb, ${c1} 26%, var(--page)) 0%, color-mix(in srgb, ${c2} 19%, var(--page)) 50%, color-mix(in srgb, ${c3} 26%, var(--page)) 100%)`);
    app.style.setProperty("--bord-pays", `linear-gradient(180deg, ${cs.join(", ")})`);
  } else { app.style.removeProperty("--fond-pays"); app.style.removeProperty("--bord-pays"); }
  app.innerHTML = (ouvert ? decorLivret() : "") + fn();
  app.querySelectorAll("[data-media]").forEach((n) => {
    const o = garde.get(n.dataset.media); if (!o) return;
    n.replaceWith(o);
    if (o.tagName === "VIDEO" && o.loop && o.paused) o.play().catch(() => {});
  });
  // Animation d'entrée seulement quand on change d'écran (pas à chaque mise à jour)
  const cle = ui.transit ? "transit" : etat.ecran + ":" + (etat.escaleActive || "");
  if (cle !== ui.dernierEcran) {
    // La page tourne vers l'avant ou vers l'arrière selon le numéro de page
    const n = folioEcran().n, sens = ui.dernierFolio == null || n >= ui.dernierFolio ? "tourne-avant" : "tourne-arriere";
    ui.dernierFolio = n;
    app.classList.remove("entree", "tourne-avant", "tourne-arriere"); void app.offsetWidth;
    app.classList.add("entree"); if (ouvert && ui.dernierEcran !== null) app.classList.add(sens);
    ui.dernierEcran = cle;
    clearTimeout(ui.finEntree); ui.finEntree = setTimeout(() => app.classList.remove("entree", "tourne-avant", "tourne-arriere"), 1100);
  }
  musique.pour(themeEcran());
  afficherBarre();
  document.getElementById("pied").innerHTML = `<span>Escape game de FLE · Prototype 2 · contenus culturels à valider</span>
    <button class="lien" data-action="aller" data-ecran="enseignante">Espace enseignante</button>`;
  // Sur petit écran, la carte défile : on la centre sur la zone des escales (Atlantique et océan Indien)
  document.querySelectorAll(".carte-cadre").forEach((c) => { if (c.scrollWidth > c.clientWidth) c.scrollLeft = (c.scrollWidth - c.clientWidth) * 0.5; });
  if (ui.transit) animerAvion();
}

/* Bruitages enregistrés (audio/sons/, générés avec Higgsfield) ; sinon le son synthétisé */
function bruitage(nom, secours) {
  if (!etat.son) return;
  if (ui.mediaAbsent.has("son-" + nom)) { if (secours) secours(); return; }
  const a = new Audio(`audio/sons/${nom}.mp3`); a.volume = .55;
  a.addEventListener("error", () => { ui.mediaAbsent.add("son-" + nom); if (secours) secours(); });
  a.play().catch(() => {});
}
/* Transit animé entre deux escales */
function lancerTransit(vers, depuisId) {
  arreterLecture();
  const depuis = depuisId && escaleParId(depuisId) ? escaleParId(depuisId) : PARIS;
  const t = { vers, depuis, debut: Date.now() };
  ui.transit = t;
  // Sécurité : si l'animation est suspendue (onglet en arrière-plan), on arrive quand même
  setTimeout(() => apresVol(t), 3800);
  bruitage("decollage", son.avion);
  window.scrollTo({ top: 0 });
  afficher();
}
function finTransit() {
  if (!ui.transit) return;
  const vers = ui.transit.vers; ui.transit = null;
  bruitage("atterrissage");
  if (vers === "cheznous") { aller("cheznous"); return; }
  const s = etat.escales[vers];
  ui.tamponAnime = null;
  const atterrir = () => aller("escale", { escaleActive: vers, escales: s.debut ? etat.escales : { ...etat.escales, [vers]: { ...s, debut: Date.now() } } });
  // Première arrivée : rideau aux couleurs du drapeau, puis l'hôtesse prend la parole
  if (!s.debut && escaleParId(vers)) {
    rideauArrivee(escaleParId(vers), () => { atterrir(); window.scrollTo({ top: 0 }); });
    setTimeout(() => capitaineParle(vers), 2000);
  } else atterrir();
}
function animerAvion() {
  const av = document.getElementById("avion"), tr = document.getElementById("trajet");
  const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const L = tr ? tr.getTotalLength() : 0;
  if (tr) { tr.style.strokeDasharray = L; tr.style.strokeDashoffset = L; }
  const pas = () => {
    if (!ui.transit) return;
    const k = Math.min(1, (Date.now() - ui.transit.debut) / 3000);
    const c = document.getElementById("compte");
    if (c) c.textContent = "00:0" + Math.max(0, Math.ceil(3 - k * 3));
    if (av && tr) {
      const e = reduit ? 1 : k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const p = tr.getPointAtLength(L * e), q = tr.getPointAtLength(Math.min(L, L * e + 1));
      const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI + 90;
      av.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${ang})`);
      tr.style.strokeDashoffset = L * (1 - e);
    }
    const t = ui.transit;
    if (k < 1) requestAnimationFrame(pas); else setTimeout(() => apresVol(t), 250);
  };
  requestAnimationFrame(pas);
}

/* =====================================================================
   MUSIQUE D'AMBIANCE ENREGISTRÉE · un morceau par pays (ElevenLabs Music via Higgsfield)
   Si le fichier manque, la musique générée (THEMES) prend le relais.
   ===================================================================== */
const PISTES = ["quebec", "senegal", "maroc", "martinique", "madagascar", "reunion", "carte", "voyage", "accueil"];
const VOLUME_PISTE = 0.32;
const piste = { el: null, id: null };
function volumePiste() { return musique.attenue ? VOLUME_PISTE * 0.22 : VOLUME_PISTE; }
function fondreAudio(el, vers, ms, fin) {
  const de = el.volume, t0 = performance.now();
  clearInterval(el._fondu);
  el._fondu = setInterval(() => {
    const k = Math.min(1, (performance.now() - t0) / ms);
    el.volume = Math.max(0, Math.min(1, de + (vers - de) * k));
    if (k >= 1) { clearInterval(el._fondu); if (fin) fin(); }
  }, 40);
}
function pisteJouer(id) {
  if (id === piste.id) return;
  const ancien = piste.el;
  if (ancien) fondreAudio(ancien, 0, 700, () => ancien.pause());
  piste.id = id; piste.el = null;
  if (!id) return;
  const el = new Audio(`audio/musique/${id}.mp3`);
  el.loop = true; el.volume = 0; el.preload = "auto";
  el.addEventListener("error", () => { ui.mediaAbsent.add("musique-" + id); if (piste.id === id) { piste.id = null; piste.el = null; musique.pour(themeEcran()); } });
  piste.el = el;
  el.play().then(() => fondreAudio(el, volumePiste(), 1200)).catch(() => {}); // bloqué avant le premier clic : relancé au clic suivant
}
// La musique de chaque pays remplace le thème généré quand le fichier existe
const pourSynthese = musique.pour.bind(musique), niveauSynthese = musique.niveau.bind(musique);
musique.pour = function (id) {
  if (!etat.musique) id = null;
  const fichier = id && (PISTES.includes(id) || id.startsWith("lieux/")) && !ui.mediaAbsent.has("musique-" + id);
  pisteJouer(fichier ? id : null);
  pourSynthese(fichier ? null : id);
};
musique.niveau = function () { niveauSynthese(); if (piste.el && !piste.el.paused) fondreAudio(piste.el, volumePiste(), 500); };
document.addEventListener("pointerdown", () => {
  if (piste.el && piste.el.paused && etat.musique) piste.el.play().then(() => fondreAudio(piste.el, volumePiste(), 1200)).catch(() => {});
}, true);

/* Le temps qui s'écoule : sablier flottant pendant les tâches + alertes */
const ALERTES_TEMPS = [15, 10, 5, 1];
function majSablier() {
  let s = document.getElementById("sablier");
  const visible = etat.debutJeu && !etat.finJeu && !ui.transit && ["escale", "carte", "cheznous", "carnet", "coffre"].includes(etat.ecran) && !(etat.ecran === "coffre" && etat.coffreOuvert);
  if (!visible) { if (s) s.remove(); return; }
  if (!s) {
    s = document.createElement("div"); s.id = "sablier"; s.className = "sablier"; s.setAttribute("role", "timer");
    s.innerHTML = `${SABLIER_SVG}<div class="sablier-txt"><b id="sablier-t"></b><small>avant le décollage</small><small id="sablier-vol" class="sablier-vol" hidden></small></div>
      <svg class="anneau" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29"/><circle id="sablier-anneau" cx="32" cy="32" r="29"/></svg>`;
    document.body.appendChild(s);
  }
  const total = REGLAGES.DUREE_JEU_MIN * 60, r = Math.max(0, resteJeu()), k = r / total;
  document.getElementById("sablier-t").textContent = mmss(r);
  document.getElementById("sable-haut").setAttribute("y", 6 + 22 * (1 - k));
  document.getElementById("sable-haut").setAttribute("height", 22 * k);
  document.getElementById("sable-bas").setAttribute("y", 50 - 22 * (1 - k));
  document.getElementById("sable-bas").setAttribute("height", 22 * (1 - k));
  const C = 2 * Math.PI * 29; const a = document.getElementById("sablier-anneau");
  a.style.strokeDasharray = C; a.style.strokeDashoffset = C * (1 - k);
  s.classList.toggle("urgent", r < 300); s.classList.toggle("vide", r <= 0);
  // Le sablier se retourne à chaque minute écoulée
  const min = Math.floor(r / 60);
  if (s._min !== undefined && s._min !== min) { s.classList.remove("tourne"); void s.offsetWidth; s.classList.add("tourne"); }
  s._min = min;
  majVolSuivant(s);
}

/* =====================================================================

   à finir et à embarquer. Rien n'est bloqué : c'est une incitation.

const TEMPS_ESCALE_MIN = 6;

  son.alerte();

  voixAnnonce = new Audio(`audio/annonces/${fichier}.wav`);
  musique.attenuer(true);
  const fin = () => musique.attenuer(false);
  voixAnnonce.addEventListener("ended", fin); voixAnnonce.addEventListener("error", fin);
  setTimeout(() => voixAnnonce && voixAnnonce.play().catch(fin), 900); // après le « ding-dong »

function majVolSuivant(s) {
  const el = document.getElementById("sablier-vol"); if (!el) return;

// Image du brevet (PNG 1800 × 1200) dessinée dans un canevas, pour la garder ou l'envoyer
async function dessinerBrevet() {
  const W = 1800, H = 1200, c = document.createElement("canvas"); c.width = W; c.height = H;
  const x = c.getContext("2d");
  const charge = (src) => new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
  try { await Promise.all(["700 80px Fraunces", "500 40px Fraunces", "italic 400 30px 'Atkinson Hyperlegible'", "700 30px 'Atkinson Hyperlegible'"].map((f) => document.fonts.load(f))); } catch (e) {}
  const fond = await charge("images/certificat.jpg");
  if (fond) x.drawImage(fond, 0, 0, W, H); else { x.fillStyle = "#f6ecd9"; x.fillRect(0, 0, W, H); }
  const encre = "#3b2414", or = "#8a5a1f", cx = W / 2;
  const ligne = (t, y, font, couleur = encre, max = 1120) => { x.font = font; x.fillStyle = couleur; x.textAlign = "center"; x.fillText(t, cx, y, max); };
  const coupe = (t, font, max) => { x.font = font; const mots = t.split(" "), l = []; let cur = ""; for (const m of mots) { const essai = cur ? cur + " " + m : m; if (x.measureText(essai).width > max && cur) { l.push(cur); cur = m; } else cur = essai; } if (cur) l.push(cur); return l; };
  const T = textesBrevet();
  ligne("COMPAGNIE DU PASSEPORT FRANCOPHONE", 190, "700 25px 'Atkinson Hyperlegible', sans-serif", or);
  ligne("Brevet de Grand Voyageur francophone", 278, "700 70px Fraunces, Georgia, serif");
  ligne(T.decerne, 342, "italic 400 31px 'Atkinson Hyperlegible', sans-serif", or);
  ligne(T.nom, 432, "700 84px Fraunces, Georgia, serif", "#7a3b1c");
  ligne(T.sous, 498, "500 33px Fraunces, Georgia, serif");
  const motif = T.motif;
  coupe(motif, "400 28px 'Atkinson Hyperlegible', sans-serif", 1000).forEach((l, i) => ligne(l, 562 + i * 38, "400 28px 'Atkinson Hyperlegible', sans-serif"));
  // Six petits tampons ronds, avec le vrai drapeau de chaque escale
  const images = await Promise.all(ESCALES.map((e) => charge("data:image/svg+xml;charset=utf-8," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="180" height="120">${DRAPEAUX[e.id] || ""}</svg>`))));
  ESCALES.forEach((e, i) => {
    const px = cx + (i - 2.5) * 124, py = 722, r = 42;
    x.save(); x.translate(px, py); x.rotate((i % 2 ? 1 : -1) * 0.12);
    x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.clip();
    if (images[i]) x.drawImage(images[i], -r * 1.5, -r, r * 3, r * 2);
    else e.drapeau.forEach((col, k, t) => { x.fillStyle = col; x.fillRect(-r + (2 * r / t.length) * k, -r, 2 * r / t.length + 1, 2 * r); });
    x.restore();
    x.save(); x.translate(px, py); x.rotate((i % 2 ? 1 : -1) * 0.12);
    x.beginPath(); x.arc(0, 0, r, 0, Math.PI * 2); x.lineWidth = 5; x.strokeStyle = e.teinte || e.couleur; x.stroke();
    x.beginPath(); x.arc(0, 0, r - 9, 0, Math.PI * 2); x.lineWidth = 1.5; x.setLineDash([4, 4]); x.strokeStyle = "rgba(255,255,255,.8)"; x.stroke();
    x.restore();
    x.font = "700 19px 'Atkinson Hyperlegible', sans-serif"; x.fillStyle = encre; x.textAlign = "center"; x.fillText(e.nom, px, py + r + 26);
  });

/* =====================================================================
   TABLEAU DES ÉQUIPES (espace enseignante)
   Sur ce poste : chaque équipe qui joue ici est ajoutée à une liste locale.
   En ligne (Supabase) : toutes les équipes de la classe, sur tous les postes.
   ===================================================================== */
const CLE_REGISTRE = "passeport-francophone-equipes";
function resumeEquipe() {
  return { id: etat.partieId, equipe: etat.equipe.nom, membres: membresInscrits(), classe: etat.classe, tampons: nbTampons(),
    escales: ESCALES.filter((e) => etat.escales[e.id].tamponne).map((e) => e.id), miles: etat.miles || 0,
    coffre: etat.coffreOuvert, debut: etat.debutJeu, fin: etat.finJeu, maj: Date.now() };
}
function lireRegistre() { try { return JSON.parse(localStorage.getItem(CLE_REGISTRE)) || []; } catch (e) { return []; } }
function majRegistre() {
  if (!etat.debutJeu) return;
  try { const r = lireRegistre().filter((x) => x.id !== etat.partieId); r.unshift(resumeEquipe()); localStorage.setItem(CLE_REGISTRE, JSON.stringify(r.slice(0, 300))); } catch (e) {}
}
async function chargerClasse() {
  if (!supabaseActif) { ui.classe = { statut: "local" }; return; }
  ui.classe = { ...(ui.classe || {}), statut: "chargement" };
  const zone = document.getElementById("tableau-classe"); if (zone) zone.innerHTML = tableauClasseHTML();
  const entetes = { "Content-Type": "application/json", apikey: REGLAGES.SUPABASE_CLE };
  if (REGLAGES.SUPABASE_CLE.startsWith("eyJ")) entetes.Authorization = "Bearer " + REGLAGES.SUPABASE_CLE;
  try {
    const rep = await fetch(REGLAGES.SUPABASE_URL.replace(/\/$/, "") + "/rest/v1/rpc/tableau_equipes", { method: "POST", headers: entetes, body: JSON.stringify({ p_code: REGLAGES.CODE_ENSEIGNANTE }) });
    if (!rep.ok) throw new Error(rep.status === 404 ? "fonction" : "http " + rep.status);
    const lignes = (await rep.json()).map((l) => ({ ...l, debut: l.debut ? Date.parse(l.debut) : null, fin: l.fin ? Date.parse(l.fin) : null, maj: l.maj ? Date.parse(l.maj) : null, enLigne: true }));
    ui.classe = { statut: "ok", lignes, quand: new Date() };
  } catch (e) { ui.classe = { statut: "erreur", msg: String(e.message || e), lignes: [] }; }
  const z = document.getElementById("tableau-classe"); if (z) z.innerHTML = tableauClasseHTML();
}
function lignesClasse() {
  const m = new Map();
  for (const l of lireRegistre()) m.set(l.id, l);
  for (const l of (ui.classe && ui.classe.lignes) || []) { const loc = m.get(l.id); m.set(l.id, loc && loc.maj > (l.maj || 0) ? { ...l, ...loc, enLigne: true } : l); }
  if (etat.debutJeu) m.set(etat.partieId, { ...resumeEquipe(), enLigne: m.get(etat.partieId)?.enLigne });
  let t = [...m.values()].filter((l) => l.debut);
  if (ui.filtreClasse) t = t.filter((l) => (l.classe || "") === ui.filtreClasse);
  return t.sort((a, b) => (b.coffre - a.coffre) || (b.tampons - a.tampons) || (b.miles - a.miles));
}
function tableauClasseHTML() {
  const c = ui.classe || { statut: supabaseActif ? "a-charger" : "local" };

  const statut = c.statut === "chargement" ? `<span class="etat-pill">Chargement…</span>`
    : c.statut === "ok" ? `<span class="etat-pill ok">En ligne · mis à jour à ${c.quand.toLocaleTimeString("fr-FR")}</span>`
    : c.statut === "erreur" ? `<span class="etat-pill faux">Tableau en ligne indisponible</span> <span class="doux petit">${c.msg === "fonction" ? "La fonction « tableau_equipes » n'est pas encore installée dans Supabase (voir schema.sql, partie 4)." : "Vérifiez la connexion internet."} En attendant : les équipes de ce poste.</span>`
    : c.statut === "local" ? `<span class="etat-pill">Équipes de ce poste</span>` : "";
  const duree = (l) => (l.debut ? mmss(((l.fin || l.maj || Date.now()) - l.debut) / 1000) : "—");
  return `<div class="rangee" style="justify-content:space-between;align-items:center">${statut}
      <div class="rangee">${classes.length ? `<label class="petit">Classe <select id="filtre-classe"><option value="">toutes</option>${classes.map((k) => `<option ${ui.filtreClasse === k ? "selected" : ""}>${esc(k)}</option>`).join("")}</select></label>` : ""}
      ${supabaseActif ? `<button class="btn second" data-action="actualiser-classe">Actualiser</button>` : ""}
      <button class="btn second" data-action="copier-classe" ${lignes.length ? "" : "disabled"}>Copier le tableau</button></div></div>
    ${lignes.length ? `<div class="tableau"><table class="table-classe">
      <thead><tr><th>#</th><th>Équipe</th><th>Voyageurs</th><th>Classe</th><th>Tampons</th><th>Miles</th><th>Coffre</th><th>Décollage</th><th>Durée</th><th>Statut</th></tr></thead>
      <tbody>${lignes.map((l, i) => `<tr${l.id === etat.partieId ? ' class="ici"' : ""}>
        <td class="num">${i < 3 && l.tampons ? ["🥇", "🥈", "🥉"][i] : i + 1}</td>
        <td><strong>${esc(l.equipe || "(sans nom)")}</strong>${l.id === etat.partieId ? ` <span class="etat-pill">ce poste</span>` : ""}</td>
        <td class="petit">${(l.membres || []).map(esc).join(", ") || "—"}</td>
        <td>${esc(l.classe || "—")}</td>
        <td><span class="drapeaux-ligne">${ESCALES.map((e) => `<span class="${(l.escales || []).includes(e.id) ? "oui" : "non"}" title="${esc(e.nom)}">${drapeauMini(e)}</span>`).join("")}</span> <span class="num">${l.tampons}/${NB}</span></td>
        <td class="num">${fmtMiles(l.miles)}</td>
        <td>${l.coffre ? "✓ ouvert" : "—"}</td>
        <td class="num">${l.debut ? new Date(l.debut).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }) : "—"}<br><span class="doux petit">${l.debut ? new Date(l.debut).toLocaleDateString("fr-FR") : ""}</span></td>
        <td class="num">${duree(l)}</td>
        <td>${l.fin ? `<span class="etat-pill ok">Mission accomplie</span>` : `<span class="etat-pill">En vol</span>`}</td></tr>`).join("")}</tbody>
    </table></div>` : `<p class="doux">Aucune équipe n'a encore décollé${supabaseActif ? "" : " sur ce poste"}.</p>`}
    <p class="doux petit">Classement : coffre ouvert, puis nombre de tampons, puis miles. Pour séparer les groupes, donnez aux élèves le lien avec <code>?classe=1A</code> à la fin.</p>`;
}

      gagnerMiles(rapide ? 300 : 200, centreDe(".tampon.anime"), rapide ? "Bonus rapidité !" : "Escale réussie !");
      popup({ titre: `Tampon ${PREP[e.id] ? PREP[e.id][0] : e.nom} obtenu !`, texte: `Chiffre gagné : ${e.chiffre} · ${nbTampons()}/${NB} tampons${rapide ? " · bonus rapidité" : ""}`, icone: drapeauMini(e), duree: 5000 });
    }, 900);
    if (nbTampons() === NB) setTimeout(() => capitaineParle("coffre"), 2600);
    else setTimeout(() => { if (etat.ecran === "escale" && etat.escaleActive === e.id && !ui.transit) carteEmbarquement(e); }, 3600);
  },
  "valider-coffre"() {
    const code = [...document.querySelectorAll("[data-chiffre]")].map((x) => x.value).join("");
    if (nbTampons() < NB) return;
    if (code.length < NB) { ui.coffreMsg = `Il faut ${NB_LETTRES} chiffres, un par escale.`; son.faux(); afficher(); return; }
    if (code === CODE_COFFRE) { ui.coffreMsg = null; son.coffre(); ui.coffreAnime = true; maj({ coffreOuvert: true, coffreEssais: etat.coffreEssais + 1 }); setTimeout(() => confettis({ nombre: 160, origine: centreDe(".serrure") }), 300);
      setTimeout(() => { gagnerMiles(500, centreDe(".serrure"), "Coffre ouvert !"); popup({ titre: "Le coffre s'ouvre !", texte: "Il vous reste une dernière mission avant le brevet de Grand Voyageur.", icone: PICTO_AVION, duree: 5500 }); }, 900); }
    else {
      son.faux();
      ui.coffreMsg = nbTampons() < NB
        ? `Le coffre reste fermé. Il vous manque ${NB - nbTampons()} tampon${NB - nbTampons() > 1 ? "s" : ""} : retournez aux escales.`
        : `Le coffre reste fermé. Vérifiez l'ordre : un chiffre par escale, dans l'ordre des pages du passeport (${LISTE_ESCALES}).`;
      maj({ coffreEssais: etat.coffreEssais + 1 });
      document.getElementById("chiffre-0")?.focus();
    }
  },
  terminer() {
    if (!etat.coffreOuvert) return;
    son.fanfare();
    ui.brevetAnime = true;
    aller("bilan", etat.finJeu ? {} : { finJeu: Date.now() });
    window.scrollTo({ top: 0 });
    setTimeout(() => confettis({ couleurs: ESCALES.flatMap((x) => x.drapeau).filter((c) => c !== "#ffffff"), nombre: 200 }), 200);
    // Le brevet se déroule, le sceau de cire tombe, puis l'hôtesse prend la parole
    setTimeout(() => son.tampon(), 1650);
    setTimeout(() => { ui.brevetAnime = false; capitaineParle("fin"); }, 2700);
  },
  async "telecharger-brevet"(b) {
    b.disabled = true; const t = b.textContent; b.textContent = "Préparation…";
    try {
      const c = await dessinerBrevet();
      const nom = textesBrevet().fichier.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "-").replace(/^-|-$/g, "").toLowerCase();
      c.toBlob((blob) => {
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `brevet-grand-voyageur-${nom || "equipe"}.png`;
        document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        popup({ titre: "Brevet téléchargé !", texte: "Retrouvez l'image dans le dossier Téléchargements.", icone: PICTO_AVION });
      }, "image/png");
    } catch (e) { popup({ titre: "Téléchargement impossible", texte: "Utilisez « Imprimer le brevet » à la place.", ton: "urgent" }); }
    b.disabled = false; b.textContent = t;
  },
  "brevet-pour"(b) { ui.brevetPour = b.dataset.i === "" ? null : +b.dataset.i; ui.brevetAnime = true; afficher(); setTimeout(() => { ui.brevetAnime = false; }, 1800); },
  "imprimer-brevet"() { document.body.classList.add("imprime-brevet"); window.print(); setTimeout(() => document.body.classList.remove("imprime-brevet"), 800); },
  "ecouter-capitaine-fin"() { capitaineParle("fin", { force: true }); },
  "actualiser-classe"() { chargerClasse(); },
  "copier-classe"() {
    const t = [["Rang", "Équipe", "Voyageurs", "Classe", "Tampons", "Escales", "Miles", "Coffre", "Décollage", "Durée", "Statut"].join("\t"),
      ...lignesClasse().map((l, i) => [i + 1, l.equipe || "", (l.membres || []).join(", "), l.classe || "", `${l.tampons}/${NB}`, (l.escales || []).map((id) => escaleParId(id)?.nom).join(", "), l.miles || 0, l.coffre ? "ouvert" : "fermé",
        l.debut ? new Date(l.debut).toLocaleString("fr-FR") : "", l.debut ? mmss(((l.fin || l.maj || Date.now()) - l.debut) / 1000) : "", l.fin ? "terminé" : "en vol"].join("\t"))].join("\n");
    copier(t, "Tableau copié : collez-le dans un tableur (Excel, LibreOffice, Google Sheets).");
  },
  "choisir-sujet"(b) { const y = window.scrollY; maj({ sujetTire: +b.dataset.i }); window.scrollTo({ top: y }); },
  "tirer-sujet"() {
    const possibles = SUJETS.map((_, i) => i).filter((i) => i !== etat.sujetTire);
    const y = window.scrollY; son.clic();
    maj({ sujetTire: possibles[Math.floor(Math.random() * possibles.length)] });
    window.scrollTo({ top: y });
  },
  "choisir-comparaison"(b) { const y = window.scrollY; maj({ preparation: { ...etat.preparation, escale: b.dataset.id } }); window.scrollTo({ top: y }); },
  outil(b) {
    const champ = document.getElementById(dernierChampPrep) || document.getElementById("prep-r");
    const t = b.dataset.t.replace("…", "").trim() + " ";
    const pos = champ.selectionStart ?? champ.value.length;
    champ.value = champ.value.slice(0, pos) + (pos && !/\s$/.test(champ.value.slice(0, pos)) ? " " : "") + t + champ.value.slice(pos);
    champ.dispatchEvent(new Event("input", { bubbles: true }));
    champ.focus();
  },
  minuteur(b) {
    const m = ui.minuteurs[b.dataset.id]; const op = b.dataset.op;
    if (op === "go") { if (resteMinuteur(m) <= 0) m.ecoule = 0; m.debut = Date.now(); son.clic(); }
    else if (op === "pause") { m.ecoule += (Date.now() - m.debut) / 1000; m.debut = null; }
    else { m.ecoule = 0; m.debut = null; }
    const y = window.scrollY; afficher(); window.scrollTo({ top: y });
  },
  "enreg-go"() { demarrerEnregistrement(); },
  "enreg-stop"() { if (enreg.rec && enreg.rec.state === "recording") enreg.rec.stop(); },
  "enreg-recommencer"() { if (enreg.url) URL.revokeObjectURL(enreg.url); enreg.url = null; enreg.etat = "pret"; majEnregistrement(); },
  imprimer() { window.print(); },
  "copier-carnet"() { copier(carnetEnTexte(), "Carnet copié : collez-le dans un document ou un courriel."); },
  "copier-donnees"() { copier(JSON.stringify(donneesAEnvoyer(), null, 2), "Données copiées au format JSON."); },
  corrige() { ui.corrigeVisible = !ui.corrigeVisible; afficher(); },
  reset() { ui.confirmerReset = true; afficher(); },
  "reset-non"() { ui.confirmerReset = false; afficher(); },
  "reset-oui"() {
    ui.erreurs = {}; ui.lexOrdre = {}; ui.confirmerReset = false; ui.cransVus = null; ui.corrigeVisible = false; dernierEnvoye = "";
    ui.envoi = { statut: supabaseActif ? "en attente" : "inactif", dernier: null };
    const sonPref = etat.son;
    const musiquePref = etat.musique;
    etat = etatInitial(); etat.son = sonPref; etat.musique = musiquePref; etat.ecran = "enseignante";
    sauver(); afficher();
  },
  "sortir-enseignante"() { ui.enseignanteOk = false; ui.corrigeVisible = false; aller(etat.debutJeu ? "carte" : "accueil"); },
};
let dernierChampPrep = "prep-r";

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-action]");
  if (!b || b.disabled) return;
  const f = actions[b.dataset.action];
  if (f) { ev.preventDefault(); f(b); }
});
// Carte ↔ visas : survoler un visa allume son avion sur la carte, et inversement
document.addEventListener("mouseover", (ev) => {
  const v = ev.target.closest && ev.target.closest(".visa-vignette[data-id], .carte-vol .pt[data-id], .punaise-liege[data-id]");
  const id = v ? v.dataset.id : null;
  if (id === ui.survol) return; ui.survol = id;
  document.querySelectorAll(".carte-vol .pt, .visa-vignette, .punaise-liege").forEach((x) => x.classList.toggle("survol", Boolean(id) && x.dataset.id === id));
});
document.addEventListener("keydown", (ev) => {
  const t = ev.target;
  if (t.matches && t.matches(".pt") && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); actions[t.dataset.action || "ouvrir-escale"](t); return; }
  if (ev.key === "Escape" && ui.carteSel) { actions["choisir-escale"]({ dataset: { id: ui.carteSel } }); return; }
  if (t.dataset && t.dataset.chiffre !== undefined) {
    if (ev.key === "Backspace" && !t.value) document.getElementById("chiffre-" + (+t.dataset.chiffre - 1))?.focus();
    if (ev.key === "Enter") { ev.preventDefault(); actions["valider-coffre"](); }
  }
});

// Saisies : mise à jour de l'état sans tout redessiner (pour garder le curseur)
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.equipe === "nom" || t.dataset.membre !== undefined) {
    const equipe = { ...etat.equipe, membres: [...etat.equipe.membres] };
    if (t.dataset.equipe === "nom") equipe.nom = t.value;
    else {
      equipe.membres[+t.dataset.membre] = t.value;
      // Un prénom change : les rôles déjà tamponnés ne valent plus, on les efface
      if (rolesTires()) {
        equipe.roles = {};
        document.getElementById("liste-roles").innerHTML = "";
        document.querySelectorAll(".tampons-voy, .tache-voy").forEach((x) => { if (x.classList.contains("tache-voy")) x.remove(); else x.innerHTML = ""; });
        const bt = document.getElementById("btn-tirer"); if (bt) { bt.textContent = "Tirer les rôles au sort"; bt.className = "btn or"; }
      }
      // La photo d'identité prend l'initiale du prénom
      const ph = document.getElementById("photo-" + t.dataset.membre);
      if (ph) { ph.classList.toggle("remplie", Boolean(t.value.trim())); ph.querySelector(".initiale").textContent = t.value.trim().charAt(0).toUpperCase(); }
    }
    maj({ equipe }, { rendu: false });
    const idMrz = document.getElementById("id-mrz"); if (idMrz) idMrz.textContent = mrz();
    const n = membresInscrits().length;
    const ok = equipageComplet();
    document.getElementById("btn-tirer").disabled = n < 3;
    document.getElementById("aide-tirage").textContent = n >= 3 ? "Chaque voyageur reçoit un rôle au hasard." : "Inscrivez au moins 3 voyageurs.";
    document.getElementById("btn-equipage").disabled = !ok;
    document.getElementById("aide-equipage").textContent = ok ? "L'équipage est prêt." : "Il faut un nom d'équipe, au moins 3 voyageurs et les rôles.";
  } else if (t.dataset.cheznous) {
    maj({ chezNous: { ...etat.chezNous, [t.dataset.cheznous]: t.value } }, { rendu: false });
    const n = chezNousRemplis();
    const btn = document.getElementById("btn-cn"); if (btn) btn.disabled = n < 2;
    const c = document.getElementById("cond-cn");
    if (c) { c.classList.toggle("ok", n >= 2); c.querySelector(".puce").textContent = n >= 2 ? "✓" : ""; document.getElementById("cond-cn-txt").textContent = `${n} photo${n > 1 ? "s" : ""} légendée${n > 1 ? "s" : ""} sur 4`; }
    // Le polaroïd se « développe » dès qu'il a une légende
    const pol = t.closest(".polaroid"); if (pol) pol.classList.toggle("developpe", Boolean(t.value.trim()));
  } else if (t.dataset.carnet) {
    const id = t.dataset.carnet;
    maj({ carnet: { ...etat.carnet, [id]: { ...etat.carnet[id], [t.dataset.col]: t.value } } }, { rendu: false });
    if (etat.ecran === "escale" && t.dataset.col === "chezMoi") {
      const e = escaleParId(id);
      const btn = document.getElementById("btn-tampon");
      if (btn) btn.disabled = !(toutJuste(e) && lexiqueFini(e) && chezToiRempli(e));
      const c = document.getElementById("cond-2");
      if (c) { c.classList.toggle("ok", chezToiRempli(e)); c.querySelector(".puce").textContent = chezToiRempli(e) ? "✓" : ""; }
    }
  } else if (t.dataset.prep) {
    dernierChampPrep = t.id;
    maj({ preparation: { ...etat.preparation, [t.dataset.prep]: t.value } }, { rendu: false });
  } else if (t.dataset.autoeval !== undefined) {
    const i = +t.dataset.autoeval;
    const set = new Set(etat.autoEval); t.checked ? set.add(i) : set.delete(i);
    maj({ autoEval: [...set].sort() }, { rendu: false });
    const n = etat.autoEval.length;
    document.getElementById("score-ae").textContent = `${n} critère${n > 1 ? "s" : ""} réussi${n > 1 ? "s" : ""} sur ${AUTO_EVAL.length}.`;
  } else if (t.dataset.chiffre !== undefined) {
    t.value = t.value.replace(/\D/g, "").slice(-1);
    if (t.value) son.cadran();
    if (t.value) document.getElementById("chiffre-" + (+t.dataset.chiffre + 1))?.focus();
  }
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "filtre-classe") { ui.filtreClasse = ev.target.value || null; const z = document.getElementById("tableau-classe"); if (z) z.innerHTML = tableauClasseHTML(); }
});
document.addEventListener("toggle", (ev) => { if (ev.target.id === "details-carnet") ui.detailsOuvert = ev.target.open; }, true);
document.addEventListener("focusin", (ev) => { if (ev.target.dataset && ev.target.dataset.prep) dernierChampPrep = ev.target.id; });
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (ev.target.id === "form-code") {
    const ok = document.getElementById("code-ens").value.trim() === REGLAGES.CODE_ENSEIGNANTE;
    ui.enseignanteOk = ok; ui.enseignanteErreur = !ok; afficher();
  }
  if (ev.target.id === "form-coffre") actions["valider-coffre"]();
});

// Horloges : chrono global, minuteurs de la mission, phase du canevas
setInterval(() => {
  majChrono();
  for (const id of ["prep", "pres"]) {
    const el = document.getElementById("min-" + id); if (!el) continue;
    const m = ui.minuteurs[id]; const r = resteMinuteur(m);
    el.textContent = r <= 0 ? "00:00" : mmss(r);
    el.classList.toggle("fini", r <= 0);
    if (r <= 0 && m.debut) { m.ecoule = m.duree; m.debut = null; son.coffre(); const y = window.scrollY; afficher(); window.scrollTo({ top: y }); }
  }
  const ph = phasePresentation();
  document.querySelectorAll("[id^=canevas-]").forEach((tr, k) => tr.classList.toggle("actif", k === ph));
  const tr = document.getElementById("enreg-temps");
  if (tr && enreg.etat === "enregistre") tr.textContent = mmss((Date.now() - enreg.debut) / 1000);
  const lab = document.getElementById("phase-pres");
  if (lab) lab.textContent = ph >= 0 ? "Maintenant : " + CANEVAS[ph][0] : "";
}, 500);

if (ttsOk) speechSynthesis.onvoiceschanged = () => {};
if (etat.ecran === "escale" && !escaleParId(etat.escaleActive)) etat.ecran = "carte";
// Première visite sur ce poste : la vidéo d'introduction se joue d'abord (sauf si le poste demande moins d'animations)
// À chaque ouverture, le passeport s'ouvre sur sa couverture, même si une partie est en cours
if (etat.debutJeu && etat.ecran !== "accueil" && etat.ecran !== "enseignante") { ui.ecranRepris = etat.ecran; etat.ecran = "accueil"; }
if (etat.ecran === "accueil" && !etat.introVue && !etat.debutJeu && !matchMedia("(prefers-reduced-motion: reduce)").matches) ui.intro = true;
afficher();
</script>
</body>
</html>
