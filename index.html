<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le Passeport francophone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Direction visuelle : un passeport. Couverture bleu nuit et or, pages en papier de sécurité,
   une encre de tampon par escale. Une colonne de lecture (~68 caractères). */
:root {
  /* Palette chaude : cuir de passeport brun, or cuivré, papier crème */
  --nuit: #4a2417; --nuit-2: #5e3020; --or: #c07a1c; --or-clair: #f0c27a;
  --papier: #f7efe2; --papier-2: #efe1cb; --carte: #fffaf2;
  --encre: #2b1a12; --encre-douce: #6b5243; --trait: #e2cfb3;
  --mix-titre: 72%;
  --ok: #2e7a3a; --ok-fond: #e3f1dc; --erreur: #b3261e; --erreur-fond: #fbe2dc; --surligne: #ffe28a;
  --mer: #dfe9ef; --mer-trait: #bfd0db;
  /* Carte ancienne : même parchemin dans les deux thèmes, par choix */
  --parch: #f1e7d2; --terre: #d8c4a0; --sepia: #8a6f4e; --sepia-fonce: #4a3a28; --x: #d42a22;
  --f-titre: "Fraunces", Georgia, "Times New Roman", serif;
  --f-texte: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code: "IBM Plex Mono", ui-monospace, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --nuit: #2a140c; --nuit-2: #3a1d12; --or: #e3a04a; --or-clair: #f3cf92;
    --papier: #1c1410; --papier-2: #271c16; --carte: #2a1f18;
    --encre: #f4e9dc; --encre-douce: #c7b3a1; --trait: #4a382c; --mix-titre: 45%;
    --ok: #5fc792; --ok-fond: #15352a; --erreur: #f0837a; --erreur-fond: #3d1c1d; --surligne: #4a3f17;
    --mer: #142033; --mer-trait: #24344f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --nuit: #2a140c; --nuit-2: #3a1d12; --or: #e3a04a; --or-clair: #f3cf92;
  --papier: #1c1410; --papier-2: #271c16; --carte: #2a1f18;
  --encre: #f4e9dc; --encre-douce: #c7b3a1; --trait: #4a382c; --mix-titre: 45%;
  --ok: #5fc792; --ok-fond: #15352a; --erreur: #f0837a; --erreur-fond: #3d1c1d; --surligne: #4a3f17;
  --mer: #142033; --mer-trait: #24344f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--papier);
  background-image:
    repeating-radial-gradient(circle at 20% 30%, transparent 0 14px, color-mix(in srgb, var(--trait) 35%, transparent) 14px 15px),
    repeating-radial-gradient(circle at 80% 70%, transparent 0 18px, color-mix(in srgb, var(--trait) 25%, transparent) 18px 19px);
  color: var(--encre); font-family: var(--f-texte); font-size: 1.05rem; line-height: 1.6; min-height: 100vh;
}
h1, h2, h3 { font-family: var(--f-titre); line-height: 1.15; text-wrap: balance; margin: 0; font-weight: 700; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }

/* Barre */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--nuit); }
.barre { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--nuit); color: #f3efe4; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 2px solid var(--or); }
.barre-in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
.marque { font-family: var(--f-titre); font-size: 1.05rem; color: var(--or-clair); background: none; border: 0; padding: 0; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.nav button, .icone-btn { background: transparent; color: #f3efe4; border: 1px solid color-mix(in srgb, var(--or-clair) 45%, transparent); border-radius: 999px; padding: 4px 14px; font-size: .92rem; }
.nav button[aria-current="true"] { background: var(--or-clair); color: #15233f; border-color: var(--or-clair); }
.icone-btn { padding: 4px 10px; }
.chrono { font-family: var(--f-code); font-size: 1.05rem; font-variant-numeric: tabular-nums; padding: 3px 10px; border-radius: 6px; background: var(--nuit-2); color: #f3efe4; }
.chrono.urgent { background: #b3261e; color: #fff; }
.chrono small { font-family: var(--f-texte); font-size: .75rem; opacity: .8; margin-right: 6px; }

main { max-width: 1040px; margin: 0 auto; padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px; }
.colonne { max-width: 720px; width: 100%; margin: 0 auto; display: grid; gap: 22px; }
main section, .lexique, .question { scroll-margin-top: 120px; }
@media print { .barre, footer, .btn, .nav { display: none !important; } body { background: #fff; } .page { break-inside: avoid; } }
.page { background: var(--carte); border: 1px solid var(--trait); border-radius: 10px; padding: clamp(18px, 4vw, 30px); display: grid; gap: 16px; min-width: 0; }
.etiquette { font-family: var(--f-code); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--encre-douce); }
.doux { color: var(--encre-douce); }
.petit { font-size: .9rem; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid var(--nuit); background: var(--nuit); color: #f6f2e6; padding: 10px 20px; border-radius: 8px; font-weight: 700; letter-spacing: .02em; }
.btn:hover:not(:disabled) { background: var(--nuit-2); }
.btn.second { background: transparent; color: var(--encre); border-color: var(--trait); }
.btn.second:hover:not(:disabled) { border-color: var(--encre-douce); background: var(--papier-2); }
.btn.or { background: var(--or); border-color: var(--or); color: #1a1408; }
.btn.or:hover:not(:disabled) { background: var(--or-clair); border-color: var(--or-clair); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.rangee { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Couverture */
.couverture { background: radial-gradient(120% 90% at 50% 0%, var(--nuit-2), var(--nuit)); color: #f3efe4; border-radius: 14px 28px 28px 14px; border-left: 14px solid color-mix(in srgb, var(--nuit) 70%, #000); padding: clamp(28px, 6vw, 56px) clamp(20px, 5vw, 48px); display: grid; justify-items: center; text-align: center; gap: 18px; box-shadow: 0 18px 40px -20px rgba(10,18,35,.55); max-width: 560px; width: 100%; margin: 0 auto; }
.couverture .pays { font-family: var(--f-code); letter-spacing: .32em; font-size: .8rem; color: var(--or-clair); }
.couverture h1 { font-size: clamp(2rem, 7vw, 3rem); color: var(--or-clair); letter-spacing: .03em; }
.couverture .sous { font-family: var(--f-titre); font-style: italic; color: #d9d3c1; }
.globe { width: 130px; height: 130px; }
.bienvenue { font-family: var(--f-code); letter-spacing: .12em; font-size: 1.15rem; color: var(--or); text-align: center; }

.message { border-left: 4px solid var(--or); padding: 4px 0 4px 18px; font-family: var(--f-titre); font-style: italic; font-size: 1.12rem; display: grid; gap: 10px; }
.regles { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; }
.regles li::marker { font-family: var(--f-code); color: var(--or); font-weight: 600; }
.champ { display: grid; gap: 6px; }
.champ label { font-weight: 700; font-size: .95rem; }
input[type="text"], input[type="password"], textarea, select { font: inherit; color: var(--encre); background: var(--papier); border: 1.5px solid var(--trait); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { min-height: 80px; resize: vertical; }
input:focus, textarea:focus, select:focus { border-color: var(--or); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--or) 30%, transparent); }
.voyageurs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.roles { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.roles li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 12px; background: var(--papier-2); border-radius: 8px; }
.roles strong { min-width: 7em; }
.role-tag { font-family: var(--f-code); font-size: .82rem; letter-spacing: .06em; text-transform: uppercase; color: var(--or); }

/* Compagnons (tirage du guide) */
.guides { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.guide { --g: #555; border: 2px solid var(--trait); border-radius: 10px; padding: 12px 8px; display: grid; justify-items: center; gap: 6px; text-align: center; background: var(--papier); transition: transform .12s, border-color .12s, opacity .2s; }
.guide .av { width: 58px; height: 58px; border-radius: 50%; background: var(--g); color: #fff; display: grid; place-items: center; font-family: var(--f-titre); font-size: 1.5rem; }
.guide strong { font-size: .92rem; line-height: 1.2; }
.guide span { font-size: .78rem; color: var(--encre-douce); line-height: 1.3; }
.guide.vise { border-color: var(--or); transform: scale(1.04); }
.guide.choisi { border-color: var(--g); background: color-mix(in srgb, var(--g) 12%, var(--carte)); }
.guides.fini .guide:not(.choisi) { opacity: .4; }
.bulle { --g: #555; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 12px; align-items: start; background: color-mix(in srgb, var(--g) 10%, var(--carte)); border: 1px solid color-mix(in srgb, var(--g) 40%, var(--trait)); border-radius: 10px; padding: 12px 14px; }
.bulle .av { width: 48px; height: 48px; border-radius: 50%; background: var(--g); color: #fff; display: grid; place-items: center; font-family: var(--f-titre); font-size: 1.2rem; }
.bulle p { font-style: italic; }

/* Carte de vol */
/* Carte façon Genially : parchemin, terres sépia, avions, croix rouges sur les escales visitées */
.titre-carte { font-family: var(--f-titre); font-weight: 500; text-align: center; letter-spacing: .06em; text-transform: uppercase; font-size: clamp(1.1rem, 3vw, 1.5rem); color: var(--sepia-fonce); }
.carte-vol { width: 100%; height: auto; display: block; border-radius: 10px; border: 2px dashed color-mix(in srgb, var(--sepia) 70%, transparent); background: var(--parch); }
.carte-cadre { overflow-x: auto; border-radius: 10px; -webkit-overflow-scrolling: touch; }
@media (max-width: 640px) { .carte-vol { min-width: 640px; } }
.carte-vol .parchemin { fill: var(--parch); }
.carte-vol .grille { stroke: color-mix(in srgb, var(--sepia) 22%, transparent); stroke-width: .8; fill: none; }
.carte-vol .terres { fill: var(--terre); stroke: var(--sepia); stroke-width: 1; stroke-linejoin: round; }
.carte-vol .route { fill: none; stroke: var(--x); stroke-width: 1.4; stroke-dasharray: 4 5; opacity: .55; }
.carte-vol text { font-family: var(--f-titre); font-size: 18px; fill: var(--sepia-fonce); font-weight: 500; paint-order: stroke; stroke: var(--parch); stroke-width: 4px; stroke-linejoin: round; }
.carte-vol .pt { cursor: pointer; outline: none; }
.carte-vol .pt .picto { fill: var(--nuit); transition: transform .15s; }
.carte-vol .pt .halo { fill: transparent; transition: fill .15s; }
.carte-vol .pt:hover .halo, .carte-vol .pt:focus-visible .halo { fill: color-mix(in srgb, var(--or) 30%, transparent); }
.carte-vol .pt:focus-visible .halo { stroke: var(--or); stroke-width: 2.5; }
.carte-vol .pt.visite text { opacity: .8; }
.carte-vol .croix path { stroke: var(--x); stroke-width: 5; stroke-linecap: round; fill: none; opacity: .92; }
.carte-vol .paris circle { fill: var(--nuit); }
.avion { transition: none; }

/* Pages du passeport */
.pages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.feuillet { --c: #333; text-align: left; background: var(--carte); border: 1px solid var(--trait); position: relative; overflow: hidden; border-radius: 8px; padding: 22px 14px 14px; display: grid; gap: 8px; align-content: start; color: var(--encre); min-width: 0; transition: transform .15s, border-color .15s; }
.feuillet:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c) 60%, var(--trait)); border-top-color: var(--c); }
.feuillet .num { font-family: var(--f-code); font-size: .75rem; color: var(--encre-douce); letter-spacing: .1em; }
.feuillet h3 { font-size: 1.15rem; color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); }
.feuillet .reg { font-size: .85rem; color: var(--encre-douce); }
.emplacement { width: 88px; height: 88px; justify-self: center; display: grid; place-items: center; border: 2px dashed var(--trait); border-radius: 50%; font-family: var(--f-code); font-size: 1.6rem; color: var(--encre-douce); }
.code-ligne { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.case { width: 48px; height: 58px; display: grid; place-items: center; border: 2px solid var(--trait); border-radius: 8px; font-family: var(--f-code); font-size: 1.6rem; font-weight: 600; background: var(--carte); }
.case.pleine { border-color: var(--or); }
.mrz { font-family: var(--f-code); font-size: .8rem; letter-spacing: .12em; color: var(--encre-douce); background: var(--papier-2); padding: 10px 12px; border-radius: 6px; overflow-x: auto; white-space: pre; }

/* Tampon */
.tampon { --c: #333; width: 96px; height: 96px; justify-self: center; border-radius: 50%; border: 3px double var(--c); display: grid; place-content: center; text-align: center; transform: rotate(-9deg); font-family: var(--f-code); line-height: 1.05; background: color-mix(in srgb, var(--c) 7%, transparent); color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); }
.tampon .t-code { font-size: .7rem; letter-spacing: .16em; }
.tampon .t-chiffre { font-size: 2.2rem; font-weight: 600; }
.tampon .t-nom { font-size: .6rem; letter-spacing: .06em; text-transform: uppercase; }
.tampon.grand { width: 150px; height: 150px; border-width: 5px; }
.tampon.grand .t-chiffre { font-size: 3.4rem; }
.tampon.grand .t-nom { font-size: .78rem; }
.tampon.anime { animation: tamponner .55s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes tamponner { 0% { transform: scale(1.9) rotate(-2deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(-9deg); opacity: 1; } }

/* Transit (repris du Genially : « arrivée à destination… 00:03 ») */
.transit { display: grid; justify-items: center; gap: 18px; text-align: center; padding-block: 20px; }
.transit .compte { font-family: var(--f-code); font-size: 2.6rem; font-weight: 600; color: var(--or); font-variant-numeric: tabular-nums; }
.transit .ambiance { font-family: var(--f-titre); font-style: italic; font-size: 1.2rem; max-width: 34em; }

/* Escale */
.entete-escale { --c: #333; border-radius: 10px; padding: clamp(18px, 4vw, 28px); background: color-mix(in srgb, var(--c) 12%, var(--carte)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--trait)); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 18px; align-items: center; }
.entete-escale > div { display: grid; gap: 8px; }
.entete-escale { position: relative; overflow: hidden; padding-top: calc(clamp(18px, 4vw, 28px) + 8px); }
/* Bande aux couleurs du drapeau de l'escale */
.bande-drapeau { position: absolute; inset: 0 0 auto; height: 8px; display: flex; box-shadow: inset 0 -1px 0 rgba(0,0,0,.12); }
.bande-drapeau span { flex: 1; }
.drapeau-mini { display: inline-flex; width: 30px; height: 18px; border-radius: 3px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.18); vertical-align: middle; }
.drapeau-mini span { flex: 1; }
.entete-escale h2 { font-size: clamp(1.7rem, 5vw, 2.3rem); color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); }
.embleme { width: 92px; height: 92px; color: var(--c); }
.accroche { font-family: var(--f-titre); font-style: italic; font-size: 1.1rem; }
.etapes { display: flex; gap: 6px; flex-wrap: wrap; }
.etapes span { font-family: var(--f-code); font-size: .75rem; letter-spacing: .04em; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--trait); background: var(--carte); color: var(--encre-douce); }
.etapes span.ok { border-color: var(--ok); background: var(--ok-fond); color: var(--encre); }
.document { display: grid; gap: 10px; }
.para { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 8px; padding: 8px 10px; border-radius: 8px; transition: background .3s; }
.para .n { font-family: var(--f-code); font-weight: 600; color: color-mix(in srgb, var(--c, var(--or)) 75%, var(--encre)); }
.para.surligne { background: var(--surligne); }
.para.lu { background: color-mix(in srgb, var(--or) 12%, transparent); }
.question { display: grid; gap: 10px; padding-top: 14px; border-top: 1px solid var(--trait); }
.question:first-of-type { border-top: 0; padding-top: 0; }
.question h3 { font-family: var(--f-texte); font-size: 1.05rem; }
.options { display: grid; gap: 8px; }
.option { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; align-items: center; gap: 8px; text-align: left; background: var(--papier); color: var(--encre); border: 1.5px solid var(--trait); border-radius: 8px; padding: 10px 12px; }
.option:hover:not(:disabled) { border-color: var(--encre-douce); }
.option .l { font-family: var(--f-code); font-weight: 600; }
.option.juste { background: var(--ok-fond); border-color: var(--ok); }
.option.faux { background: var(--erreur-fond); border-color: var(--erreur); }
.option:disabled { cursor: default; }
.option .marque-etat { font-family: var(--f-code); font-size: .8rem; font-weight: 600; }
.option.juste .marque-etat { color: var(--ok); }
.option.faux .marque-etat { color: var(--erreur); }
.retour { font-size: .95rem; padding: 8px 12px; border-radius: 6px; }
.retour.faux { background: var(--erreur-fond); border-left: 4px solid var(--erreur); }
.retour.juste { background: var(--ok-fond); border-left: 4px solid var(--ok); }

/* Lexique : associer */
.lexique { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 10px 14px; }
.lexique .col { display: grid; gap: 8px; align-content: start; }
.tuile { text-align: left; background: var(--papier); color: var(--encre); border: 1.5px solid var(--trait); border-radius: 8px; padding: 10px 12px; min-height: 48px; }
.tuile.mot { font-weight: 700; }
.tuile[aria-pressed="true"] { border-color: var(--or); background: color-mix(in srgb, var(--or) 16%, var(--carte)); }
.tuile.trouve { background: var(--ok-fond); border-color: var(--ok); cursor: default; }
.tuile.secoue { animation: secouer .35s; border-color: var(--erreur); background: var(--erreur-fond); }
@keyframes secouer { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.carnet-mini { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
details summary { cursor: pointer; font-weight: 700; }
details[open] summary { margin-bottom: 12px; }
.condition { display: flex; gap: 8px; align-items: center; font-size: .92rem; }
.condition .puce { width: 1.3em; height: 1.3em; border-radius: 50%; border: 2px solid var(--trait); display: inline-grid; place-items: center; font-size: .75rem; flex: none; }
.condition.ok .puce { background: var(--ok); border-color: var(--ok); color: #fff; }
.recompense { display: grid; justify-items: center; gap: 14px; text-align: center; }

/* Carnet */
.fiches { display: grid; gap: 16px; }
.fiche { --c: #333; border-left: 6px solid var(--c); }
.fiche h3 { color: color-mix(in srgb, var(--c) var(--mix-titre), var(--encre)); font-size: 1.25rem; }
.fiche-grille { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fiche-grille .large { grid-column: 1 / -1; }
.suggestions { display: flex; gap: 6px; flex-wrap: wrap; }
.suggestions button { font-size: .82rem; padding: 2px 10px; border-radius: 999px; border: 1px dashed var(--trait); background: transparent; color: var(--encre-douce); }

/* Coffre */
.coffre { display: grid; justify-items: center; gap: 18px; text-align: center; }
.cadran { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.cadran label { display: grid; gap: 4px; justify-items: center; font-family: var(--f-code); font-size: .75rem; letter-spacing: .1em; color: var(--encre-douce); }
.cadran input { width: 56px; height: 68px; text-align: center; font-family: var(--f-code); font-size: 2rem; font-weight: 600; padding: 0; }
.serrure { width: 74px; height: 74px; }

  const h = [...o].map((b) => b.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

let ctxAudio = null;
function bip(notes, { type = "sine", vol = 0.12 } = {}) {
  if (!etat.son) return;
  try {
    ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
    let t = ctxAudio.currentTime;
    for (const [f, d] of notes) {
      const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
      o.connect(g).connect(ctxAudio.destination); o.start(t); o.stop(t + d);
      t += d * 0.8;
    }
  } catch (e) {}
}

function voixPour(lang) {

}
function lireDocument(e) {

  majEscale(e.id, { ecoute: (etat.escales[e.id].ecoute || 0) + 1 }, { rendu: false });

    const u = new SpeechSynthesisUtterance(p);
    u.lang = e.voix; const v = voixPour(e.voix); if (v) u.voice = v;
    u.rate = 0.9;
    u.onstart = () => { if (ui.lecture) { ui.lecture.para = k + 1; afficherLecture(); } };
    if (k === e.document.length - 1) u.onend = () => { ui.lecture = null; afficherLecture(); };

const TERRES_D = TERRES.map((t) => {
  let d = "";
  for (let i = 0; i < t.length; i += 2) { const [x, y] = proj({ lon: t[i], lat: t[i + 1] }); d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); }

}).join("");
// Position des étiquettes : [décalage x, décalage y, ancrage]
const ETIQUETTES = { quebec: [16, 6, "start"], senegal: [-16, 6, "end"], maroc: [16, 4, "start"], martinique: [-16, 6, "end"], madagascar: [-18, 0, "end"], reunion: [16, 18, "start"] };
const AVION = "M0-9 1.6-3.5 9-0.5V1.8L1.6 0.6 1 6 3.4 8V9.6L0 8.6-3.4 9.6V8L-1 6-1.6 0.6-9 1.8V-0.5L-1.6-3.5Z";

function carteVol({ avion = null } = {}) {
  let grille = "";
  for (let lon = -150; lon <= 180; lon += 30) { const [x] = proj({ lon, lat: 0 }); grille += `M${x} 28V383`; }
  for (let lat = 60; lat >= -40; lat -= 20) { const [, y] = proj({ lon: 0, lat }); grille += `M0 ${y}H1000`; }
  const [px, py] = proj(PARIS);
  const routes = avion ? "" : ESCALES.filter((e) => etat.escales[e.id].tamponne).map((e) => `<path class="route faite" d="${arc(PARIS, e)}"/>`).join("");
  const points = ESCALES.map((e) => {
    const [x, y] = proj(e); const s = etat.escales[e.id];
    const [dx, dy, anchor] = ETIQUETTES[e.id] || [14, 5, "start"];
    return `<g class="pt${s.tamponne ? " visite" : ""}" data-action="ouvrir-escale" data-id="${e.id}" tabindex="0" role="button" aria-label="Escale ${esc(e.nom)}${s.tamponne ? ", déjà visitée, chiffre " + e.chiffre : ""}">
      <title>${esc(e.nom)} · ${esc(e.contact)}</title>
      <circle class="halo" cx="${x}" cy="${y}" r="20"/>
      <path class="picto" d="${AVION}" transform="translate(${x} ${y}) scale(1.25)"/>
      <text x="${x + dx}" y="${y + dy}" text-anchor="${anchor}">${esc(e.nom)}${s.tamponne ? " · " + e.chiffre : ""}</text>
      ${s.tamponne ? `<g class="croix" transform="translate(${x + 9} ${y - 11}) rotate(-8)"><path d="M-9-8 9 8M9-9-8 9"/></g>` : ""}</g>`;
  }).join("");
  const av = avion ? `<path id="trajet" d="${avion}" fill="none" stroke="var(--nuit)" stroke-width="2.2" stroke-dasharray="1 0"/>
    <g class="avion" id="avion"><path d="${AVION}" transform="scale(1.4)" fill="var(--nuit)"/></g>` : "";
  return `<div class="carte-cadre"><svg class="carte-vol" viewBox="0 28 1000 355" role="img" aria-label="Carte du monde : choisissez une des ${NB_LETTRES} escales au départ de Paris">
    <defs><filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .22 0"/><feComposite in2="SourceGraphic" operator="in"/></filter></defs>
    <rect x="0" y="28" width="1000" height="355" class="parchemin"/>
    <path class="grille" d="${grille}"/>
    <path class="terres" d="${TERRES_D}"/>
    <rect x="0" y="28" width="1000" height="355" filter="url(#grain)" fill="#000"/>
    ${routes}
    <g class="paris"><title>Paris · départ</title><circle cx="${px}" cy="${py}" r="9"/><path d="M${px} ${py + 4}l-4.2-4.2a2.4 2.4 0 0 1 4.2-2.6 2.4 2.4 0 0 1 4.2 2.6Z" fill="var(--parch)"/></g>
    ${points}${av}</svg></div>`;
}

function mrz() {
  const nom = (etat.equipe.nom || "EQUIPE").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/[^A-Z0-9]+/g, "<");
  const code = ESCALES.map((e) => (etat.escales[e.id].tamponne ? e.chiffre : "<")).join("");
  const l1 = ("P<FRA<PASSEPORT<<FRANCOPHONE<<" + nom).padEnd(44, "<").slice(0, 44);
  const l2 = ("RAOUL<<" + code + "<<" + ESCALES.map((e) => e.code).join("") + "<<45MIN").padEnd(44, "<").slice(0, 44);
  return l1 + "\n" + l2;
}
function bulleGuide(texte, intro = true) {
  const g = guideActuel(); if (!g) return `<p class="indice">${esc(texte)}</p>`;
  return `<div class="bulle" style="--g:${g.couleur}"><span class="av" aria-hidden="true">${g.initiale}</span>

}

function ecranEscale() {
  const e = escaleParId(etat.escaleActive);
  if (!e) return ecranCarte();
  const s = etat.escales[e.id];
  const erreurs = ui.erreurs[e.id] || {};
  const parasSurlignes = new Set(Object.keys(erreurs).filter((i) => !questionJuste(e, +i)).map((i) => e.questions[+i].paragraphe));
  const index = ESCALES.indexOf(e);
  const pret = toutJuste(e) && lexiqueFini(e) && chezToiRempli(e);

  const etapes = [["Document", true], ["Quiz", toutJuste(e)], ["Lexique", lexiqueFini(e)], ["Et chez toi ?", chezToiRempli(e)], ["Tampon", s.tamponne]];

  const questions = e.questions.map((q, i) => {
    const juste = questionJuste(e, i);
    const faux = !juste && erreurs[i] !== undefined ? erreurs[i] : null;
    return `<div class="question">
      <h3>${i + 1}. ${esc(q.q)}</h3>
      <div class="options">
        ${q.options.map((o, j) => {
          const cls = juste && j === q.correcte ? " juste" : faux === j ? " faux" : "";
          const marque = juste && j === q.correcte ? "Juste" : faux === j ? "Pas encore" : "";
          return `<button class="option${cls}" data-action="repondre" data-q="${i}" data-o="${j}" ${juste ? "disabled" : ""}>
            <span class="l">${lettre(j)}.</span><span>${esc(o)}</span><span class="marque-etat">${marque}</span></button>`;
        }).join("")}
      </div>
      ${juste ? `<p class="retour juste">Bravo, c'est la bonne réponse.</p>`
        : faux !== null ? `<p class="retour faux">Ce n'est pas encore ça. Relisez le paragraphe ${q.paragraphe}, surligné dans le document, puis réessayez.</p>` : ""}
    </div>`;
  }).join("");

  if (!ui.lexOrdre[e.id]) ui.lexOrdre[e.id] = melanger(e.lexique.map((_, i) => i));
  const trouves = new Set(s.lexique);
  const lexique = `<div class="lexique">
      <div class="col" role="group" aria-label="Mots">${e.lexique.map(([mot], i) => `<button class="tuile mot${trouves.has(i) ? " trouve" : ""}" data-action="lex-mot" data-i="${i}" aria-pressed="${ui.lexSel === i}" ${trouves.has(i) ? "disabled" : ""}>${esc(mot)}</button>`).join("")}</div>
      <div class="col" role="group" aria-label="Définitions">${ui.lexOrdre[e.id].map((i) => `<button class="tuile def${trouves.has(i) ? " trouve" : ""}${ui.lexSecoue === i ? " secoue" : ""}" data-action="lex-def" data-i="${i}" ${trouves.has(i) ? "disabled" : ""}>${esc(e.lexique[i][1])}</button>`).join("")}</div>
    </div>
    <p class="doux petit" id="lex-aide">${lexiqueFini(e) ? "Lexique complet ! Les trois mots sont proposés dans votre carnet." : ui.lexSel !== null ? `Choisissez la définition de « ${esc(e.lexique[ui.lexSel][0])} ».` : "Cliquez sur un mot, puis sur sa définition."}</p>`;

  const recompense = s.tamponne ? `<section class="page recompense">
      <span class="etiquette">${esc(e.contact)} tamponne votre passeport</span>
      ${tamponHTML(e, { grand: true, anime: ui.tamponAnime === e.id })}
      <p>Chiffre gagné : <strong style="font-family: var(--f-code); font-size: 1.3rem">${e.chiffre}</strong></p>
      <div class="rangee" style="justify-content:center">${prochaineEscaleBouton(e)}</div>

function resteMinuteur(m) { return m.duree - (m.ecoule + (m.debut ? (Date.now() - m.debut) / 1000 : 0)); }
function phasePresentation() {
  const m = ui.minuteurs.pres; const ecoule = m.duree - resteMinuteur(m);
  if (!m.debut && ecoule <= 0) return -1;
  let cumul = 0;
  for (let k = 0; k < CANEVAS.length; k++) { cumul += CANEVAS[k][3]; if (ecoule < cumul) return k; }
  return -1;
}
function minuteurHTML(id, nom) {
  const m = ui.minuteurs[id]; const r = resteMinuteur(m);
  return `<div class="minuteur">
    <span class="etiquette" style="color:#cfd6e4">${nom} · ${m.duree / 60} min</span>
    <span class="temps${r <= 0 ? " fini" : ""}" id="min-${id}">${r <= 0 ? "00:00" : mmss(r)}</span>
    ${id === "pres" ? `<span class="phase" id="phase-pres"></span>` : ""}
    <div class="rangee" style="justify-content:center">
      <button class="btn or" data-action="minuteur" data-id="${id}" data-op="${m.debut ? "pause" : "go"}">${m.debut ? "Pause" : r < m.duree && r > 0 ? "Reprendre" : "Démarrer"}</button>
      <button class="btn second" data-action="minuteur" data-id="${id}" data-op="reset">Remettre à zéro</button>
    </div></div>`;
}

function afficher() {
  const ecrans = { accueil: ecranAccueil, capitaine: ecranCapitaine, cheznous: ecranChezNous, carte: ecranCarte, escale: ecranEscale, carnet: ecranCarnet, coffre: ecranCoffre, mission: ecranMission, enseignante: ecranEnseignante };
  const fn = ui.transit ? ecranTransit : ecrans[etat.ecran] || ecranAccueil;
  document.getElementById("app").innerHTML = fn();
  afficherBarre();
  document.getElementById("pied").innerHTML = `<span>Escape game de FLE · Prototype 2 · contenus culturels à valider</span>
    <button class="lien" data-action="aller" data-ecran="enseignante">Espace enseignante</button>`;
  // Sur petit écran, la carte défile : on la centre sur la zone des escales (Atlantique et océan Indien)
  document.querySelectorAll(".carte-cadre").forEach((c) => { if (c.scrollWidth > c.clientWidth) c.scrollLeft = (c.scrollWidth - c.clientWidth) * 0.5; });
  if (ui.transit) animerAvion();
}

/* Transit animé entre deux escales */
function lancerTransit(vers, depuisId) {
  arreterLecture();
  const depuis = depuisId && escaleParId(depuisId) ? escaleParId(depuisId) : PARIS;
  const t = { vers, depuis, debut: Date.now() };
  ui.transit = t;
  // Sécurité : si l'animation est suspendue (onglet en arrière-plan), on arrive quand même
  setTimeout(() => { if (ui.transit === t) finTransit(); }, 3800);
  son.avion();
  window.scrollTo({ top: 0 });
  afficher();
}
function finTransit() {
  if (!ui.transit) return;
  const vers = ui.transit.vers; ui.transit = null;
  if (vers === "cheznous") { aller("cheznous"); return; }
  const s = etat.escales[vers];
  ui.tamponAnime = null;
  aller("escale", { escaleActive: vers, escales: s.debut ? etat.escales : { ...etat.escales, [vers]: { ...s, debut: Date.now() } } });
}
function animerAvion() {
  const av = document.getElementById("avion"), tr = document.getElementById("trajet");
  const reduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const L = tr ? tr.getTotalLength() : 0;
  if (tr) { tr.style.strokeDasharray = L; tr.style.strokeDashoffset = L; }
  const pas = () => {
    if (!ui.transit) return;
    const k = Math.min(1, (Date.now() - ui.transit.debut) / 3000);
    const c = document.getElementById("compte");
    if (c) c.textContent = "00:0" + Math.max(0, Math.ceil(3 - k * 3));
    if (av && tr) {
      const e = reduit ? 1 : k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      const p = tr.getPointAtLength(L * e), q = tr.getPointAtLength(Math.min(L, L * e + 1));
      const ang = Math.atan2(q.y - p.y, q.x - p.x) * 180 / Math.PI + 90;
      av.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${ang})`);
      tr.style.strokeDashoffset = L * (1 - e);
    }
    if (k < 1) requestAnimationFrame(pas); else setTimeout(finTransit, 250);
  };
  requestAnimationFrame(pas);
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
const actions = {
  embarquer() { if (!etat.debutJeu) aller("capitaine"); else aller(etat.ecran === "accueil" ? "carte" : etat.ecran); },
  aller(b) { aller(b.dataset.ecran); },
  son() { etat.son = !etat.son; sauver(); afficherBarre(); son.clic(); },
  "tirer-roles"() {
    const idx = etat.equipe.membres.map((m, i) => (m.trim() ? i : -1)).filter((i) => i >= 0);
    if (idx.length < 3) return;
    const roles = {}; const ordre = melanger(idx);
    let distribues = ROLES.map((r) => r.id);
    if (idx.length === 3) distribues = distribues.filter((r) => r !== "gardien");
    melanger(distribues).forEach((r, k) => { roles[ordre[k]] = [r]; });
    if (idx.length === 3) { const nav = ordre.find((i) => roles[i][0] === "navigateur"); roles[nav].push("gardien"); }
    son.clic();
    maj({ equipe: { ...etat.equipe, roles } });
  },
  "tirer-guide"() {
    const cible = Math.floor(Math.random() * GUIDES.length);
    const total = GUIDES.length * 3 + cible;
    ui.tirage = { vise: 0, n: 0 };
    const pas = () => {
      ui.tirage.vise = ui.tirage.n % GUIDES.length;
      son.clic(); afficher();
      if (ui.tirage.n++ < total) setTimeout(pas, 60 + ui.tirage.n * 12);
      else { const id = GUIDES[ui.tirage.vise].id; ui.tirage = null; son.juste(); maj({ guide: id }); annoncer("Votre guide est " + guideActuel().nom + ", " + guideActuel().metier); }
    };
    pas();
  },
  decoller() {
    if (membresInscrits().length < 3 || !rolesTires() || !etat.guide) return;
    if (supabaseActif) ui.envoi.statut = "en attente";
    etat = { ...etat, debutJeu: Date.now(), ecran: "cheznous" };
    sauver();
    lancerTransit("cheznous");
  },
  "tamponner-cheznous"() {
    if (chezNousRemplis() < 2) return;
    ui.tamponAnime = "moi"; son.tampon();
    maj({ chezNous: { ...etat.chezNous, tamponne: true } });
    annoncer("Tampon Chez nous obtenu");
  },
  "ouvrir-escale"(b) {
    const id = b.dataset.id;
    if (etat.escales[id].tamponne || (etat.ecran === "escale" && etat.escaleActive === id)) {
      ui.tamponAnime = null; aller("escale", { escaleActive: id }); return;
    }
    lancerTransit(id, b.dataset.depuis || null);
  },
  "fin-transit"() { finTransit(); },
  lire() { lireDocument(escaleParId(etat.escaleActive)); },
  repondre(b) {
    const e = escaleParId(etat.escaleActive);
    const i = +b.dataset.q, o = +b.dataset.o;
    const s = etat.escales[e.id];
    if (questionJuste(e, i)) return;
    const reponses = [...s.reponses]; reponses[i] = o;
    const essais = [...s.essais]; essais[i] += 1;
    ui.erreurs[e.id] = { ...(ui.erreurs[e.id] || {}) };
    const bon = o === e.questions[i].correcte;
    if (bon) delete ui.erreurs[e.id][i]; else ui.erreurs[e.id][i] = o;
    bon ? son.juste() : son.faux();
    const y = window.scrollY;
    majEscale(e.id, { reponses, essais });
    window.scrollTo({ top: y });
    annoncer(bon ? "Bonne réponse" : `Pas encore. Relisez le paragraphe ${e.questions[i].paragraphe}.`);
    const q = document.querySelectorAll(".question")[i];
    if (q) q.querySelector(bon ? ".option.juste" : ".option.faux")?.focus({ preventScroll: true });
  },
  indice() { son.clic(); const y = window.scrollY; majEscale(etat.escaleActive, { indiceVu: true }); window.scrollTo({ top: y }); },
  "lex-mot"(b) { ui.lexSel = +b.dataset.i; ui.lexSecoue = null; son.clic(); const y = window.scrollY; afficher(); window.scrollTo({ top: y }); document.querySelector(`.tuile.def:not(.trouve)`)?.focus({ preventScroll: true }); },
  "lex-def"(b) {
    const e = escaleParId(etat.escaleActive);
    const i = +b.dataset.i; const y = window.scrollY;
    if (ui.lexSel === null) { annoncer("Choisissez d'abord un mot."); document.getElementById("lex-aide").textContent = "Choisissez d'abord un mot à gauche."; return; }
    const s = etat.escales[e.id];
    if (i === ui.lexSel) {
      son.juste(); ui.lexSel = null; ui.lexSecoue = null;
      majEscale(e.id, { lexique: [...s.lexique, i] });
      annoncer("Bonne association");
    } else {
      son.faux(); ui.lexSecoue = i;
      majEscale(e.id, { lexiqueEssais: s.lexiqueEssais + 1 });
      annoncer("Ce n'est pas la bonne définition. Relisez le document.");
      setTimeout(() => { ui.lexSecoue = null; document.querySelectorAll(".secoue").forEach((x) => x.classList.remove("secoue")); }, 400);
    }
    window.scrollTo({ top: y });
    document.querySelector(`.tuile.mot:not(.trouve)`)?.focus({ preventScroll: true });
  },
  "mots-lexique"(b) {
    const e = escaleParId(b.dataset.id); const y = window.scrollY;
    maj({ carnet: { ...etat.carnet, [e.id]: { ...etat.carnet[e.id], mots: e.lexique.map(([m]) => m).join(", ") } } });
    window.scrollTo({ top: y });
  },
  tamponner() {
    const e = escaleParId(etat.escaleActive);
    if (!toutJuste(e) || !lexiqueFini(e) || !chezToiRempli(e)) return;
    ui.tamponAnime = e.id; son.tampon();
    majEscale(e.id, { tamponne: true, fin: Date.now() });
    annoncer(`Tampon obtenu. Chiffre gagné : ${e.chiffre}`);
    document.querySelector(".recompense")?.scrollIntoView({ block: "center", behavior: "smooth" });
  },
  "valider-coffre"() {
    const code = [...document.querySelectorAll("[data-chiffre]")].map((x) => x.value).join("");
    if (code.length < NB) { ui.coffreMsg = `Il faut ${NB_LETTRES} chiffres, un par escale.`; son.faux(); afficher(); return; }
    if (code === CODE_COFFRE) { ui.coffreMsg = null; son.coffre(); maj({ coffreOuvert: true, coffreEssais: etat.coffreEssais + 1 }); }
    else {
      son.faux();
      ui.coffreMsg = nbTampons() < NB
        ? `Le coffre reste fermé. Il vous manque ${NB - nbTampons()} tampon${NB - nbTampons() > 1 ? "s" : ""} : retournez aux escales.`
        : `Le coffre reste fermé. Vérifiez l'ordre : un chiffre par escale, dans l'ordre des pages du passeport (${LISTE_ESCALES}).`;
      maj({ coffreEssais: etat.coffreEssais + 1 });
      document.getElementById("chiffre-0")?.focus();
    }
  },
  "choisir-sujet"(b) { const y = window.scrollY; maj({ sujetTire: +b.dataset.i }); window.scrollTo({ top: y }); },
  "tirer-sujet"() {
    const possibles = SUJETS.map((_, i) => i).filter((i) => i !== etat.sujetTire);
    const y = window.scrollY; son.clic();
    maj({ sujetTire: possibles[Math.floor(Math.random() * possibles.length)] });
    window.scrollTo({ top: y });
  },
  "choisir-comparaison"(b) { const y = window.scrollY; maj({ preparation: { ...etat.preparation, escale: b.dataset.id } }); window.scrollTo({ top: y }); },
  outil(b) {
    const champ = document.getElementById(dernierChampPrep) || document.getElementById("prep-r");
    const t = b.dataset.t.replace("…", "").trim() + " ";
    const pos = champ.selectionStart ?? champ.value.length;
    champ.value = champ.value.slice(0, pos) + (pos && !/\s$/.test(champ.value.slice(0, pos)) ? " " : "") + t + champ.value.slice(pos);
    champ.dispatchEvent(new Event("input", { bubbles: true }));
    champ.focus();
  },
  minuteur(b) {
    const m = ui.minuteurs[b.dataset.id]; const op = b.dataset.op;
    if (op === "go") { if (resteMinuteur(m) <= 0) m.ecoule = 0; m.debut = Date.now(); son.clic(); }
    else if (op === "pause") { m.ecoule += (Date.now() - m.debut) / 1000; m.debut = null; }
    else { m.ecoule = 0; m.debut = null; }
    const y = window.scrollY; afficher(); window.scrollTo({ top: y });
  },
  imprimer() { window.print(); },
  "copier-carnet"() { copier(carnetEnTexte(), "Carnet copié : collez-le dans un document ou un courriel."); },
  "copier-donnees"() { copier(JSON.stringify(donneesAEnvoyer(), null, 2), "Données copiées au format JSON."); },
  corrige() { ui.corrigeVisible = !ui.corrigeVisible; afficher(); },
  reset() { ui.confirmerReset = true; afficher(); },
  "reset-non"() { ui.confirmerReset = false; afficher(); },
  "reset-oui"() {
    ui.erreurs = {}; ui.lexOrdre = {}; ui.confirmerReset = false; ui.corrigeVisible = false; dernierEnvoye = "";
    ui.envoi = { statut: supabaseActif ? "en attente" : "inactif", dernier: null };
    const sonPref = etat.son;
    etat = etatInitial(); etat.son = sonPref; etat.ecran = "enseignante";
    sauver(); afficher();
  },
  "sortir-enseignante"() { ui.enseignanteOk = false; ui.corrigeVisible = false; aller(etat.debutJeu ? "carte" : "accueil"); },
};
let dernierChampPrep = "prep-r";

document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-action]");
  if (!b || b.disabled) return;
  const f = actions[b.dataset.action];
  if (f) { ev.preventDefault(); f(b); }
});
document.addEventListener("keydown", (ev) => {
  const t = ev.target;
  if (t.matches && t.matches(".pt") && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); actions["ouvrir-escale"](t); return; }
  if (t.dataset && t.dataset.chiffre !== undefined) {
    if (ev.key === "Backspace" && !t.value) document.getElementById("chiffre-" + (+t.dataset.chiffre - 1))?.focus();
    if (ev.key === "Enter") { ev.preventDefault(); actions["valider-coffre"](); }
  }
});

// Saisies : mise à jour de l'état sans tout redessiner (pour garder le curseur)
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset.equipe === "nom" || t.dataset.membre !== undefined) {
    const equipe = { ...etat.equipe, membres: [...etat.equipe.membres] };
    if (t.dataset.equipe === "nom") equipe.nom = t.value;
    else { equipe.membres[+t.dataset.membre] = t.value; if (rolesTires()) { equipe.roles = {}; document.getElementById("liste-roles").innerHTML = ""; } }
    maj({ equipe }, { rendu: false });
    const n = membresInscrits().length;
    const ok = n >= 3 && rolesTires() && etat.equipe.nom.trim() && etat.guide;
    document.getElementById("btn-tirer").disabled = n < 3;
    document.getElementById("aide-tirage").textContent = n >= 3 ? "Chaque voyageur reçoit un rôle au hasard." : "Inscrivez au moins 3 voyageurs.";
    document.getElementById("btn-decoller").disabled = !ok;
    document.getElementById("aide-decoller").textContent = ok ? `Le chronomètre de ${REGLAGES.DUREE_JEU_MIN} minutes démarre au décollage.` : "Il faut un nom d'équipe, au moins 3 voyageurs, les rôles et un guide.";
  } else if (t.dataset.cheznous) {
    maj({ chezNous: { ...etat.chezNous, [t.dataset.cheznous]: t.value } }, { rendu: false });
    const n = chezNousRemplis();
    const btn = document.getElementById("btn-cn"); if (btn) btn.disabled = n < 2;
    const c = document.getElementById("cond-cn");
    if (c) { c.classList.toggle("ok", n >= 2); c.querySelector(".puce").textContent = n >= 2 ? "✓" : ""; document.getElementById("cond-cn-txt").textContent = `${n} case${n > 1 ? "s" : ""} remplie${n > 1 ? "s" : ""} sur 4`; }
  } else if (t.dataset.carnet) {
    const id = t.dataset.carnet;
    maj({ carnet: { ...etat.carnet, [id]: { ...etat.carnet[id], [t.dataset.col]: t.value } } }, { rendu: false });
    if (etat.ecran === "escale" && t.dataset.col === "chezMoi") {
      const e = escaleParId(id);
      const btn = document.getElementById("btn-tampon");
      if (btn) btn.disabled = !(toutJuste(e) && lexiqueFini(e) && chezToiRempli(e));
      const c = document.getElementById("cond-2");
      if (c) { c.classList.toggle("ok", chezToiRempli(e)); c.querySelector(".puce").textContent = chezToiRempli(e) ? "✓" : ""; }
    }
  } else if (t.dataset.prep) {
    dernierChampPrep = t.id;
    maj({ preparation: { ...etat.preparation, [t.dataset.prep]: t.value } }, { rendu: false });
  } else if (t.dataset.autoeval !== undefined) {
    const i = +t.dataset.autoeval;
    const set = new Set(etat.autoEval); t.checked ? set.add(i) : set.delete(i);
    maj({ autoEval: [...set].sort() }, { rendu: false });
    const n = etat.autoEval.length;
    document.getElementById("score-ae").textContent = `${n} critère${n > 1 ? "s" : ""} réussi${n > 1 ? "s" : ""} sur ${AUTO_EVAL.length}.`;
  } else if (t.dataset.chiffre !== undefined) {
    t.value = t.value.replace(/\D/g, "").slice(-1);
    if (t.value) document.getElementById("chiffre-" + (+t.dataset.chiffre + 1))?.focus();
  }
});
document.addEventListener("toggle", (ev) => { if (ev.target.id === "details-carnet") ui.detailsOuvert = ev.target.open; }, true);
document.addEventListener("focusin", (ev) => { if (ev.target.dataset && ev.target.dataset.prep) dernierChampPrep = ev.target.id; });
document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  if (ev.target.id === "form-code") {
    const ok = document.getElementById("code-ens").value.trim() === REGLAGES.CODE_ENSEIGNANTE;
    ui.enseignanteOk = ok; ui.enseignanteErreur = !ok; afficher();
  }
  if (ev.target.id === "form-coffre") actions["valider-coffre"]();
});

// Horloges : chrono global, minuteurs de la mission, phase du canevas
setInterval(() => {
  majChrono();
  for (const id of ["prep", "pres"]) {
    const el = document.getElementById("min-" + id); if (!el) continue;
    const m = ui.minuteurs[id]; const r = resteMinuteur(m);
    el.textContent = r <= 0 ? "00:00" : mmss(r);
    el.classList.toggle("fini", r <= 0);
    if (r <= 0 && m.debut) { m.ecoule = m.duree; m.debut = null; son.coffre(); const y = window.scrollY; afficher(); window.scrollTo({ top: y }); }
  }
  const ph = phasePresentation();
  document.querySelectorAll("[id^=canevas-]").forEach((tr, k) => tr.classList.toggle("actif", k === ph));
  const lab = document.getElementById("phase-pres");
  if (lab) lab.textContent = ph >= 0 ? "Maintenant : " + CANEVAS[ph][0] : "";
}, 500);

if (ttsOk) speechSynthesis.onvoiceschanged = () => {};
if (etat.ecran === "escale" && !escaleParId(etat.escaleActive)) etat.ecran = "carte";
afficher();
</script>
